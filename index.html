<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Spin THR</title>

<!-- CONFETTI FIXED -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
margin:0;
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
overflow:hidden;
}

.app{
max-width:420px;
width:100%;
text-align:center;
}

input{
padding:8px;
width:60%;
font-size:14px;
border:none;
border-radius:8px;
text-align:center;
margin-bottom:50px;
}

.pointer{
width:0;
height:0;
border-left:19px solid transparent;
border-right:19px solid transparent;
border-top:45px solid gold;
margin:auto;
}

canvas{
border-radius:50%;
border:10px solid white;
}

button{
margin-top:20px;
padding:14px 40px;
font-size:22px;
background:gold;
border:none;
border-radius:12px;
cursor:pointer;
}

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
visibility:hidden;
transition:.4s;
}

.popup.show{
opacity:1;
visibility:visible;
}

.card{
background:linear-gradient(135deg,#fde047,#f59e0b);
color:black;
padding:35px;
border-radius:20px;
animation:pop .4s ease;
text-align:center;
}

#winner,#message,#amount{
margin:10px 0;
font-weight:bold;
}

#winner{font-size:22px;}
#message{font-size:20px;}
#amount{font-size:36px;}

@keyframes pop{
from{transform:scale(.5)}
to{transform:scale(1)}
}
</style>
</head>

<body>

<div class="app">
<h2>THR 2026</h2>
<input id="playerName" placeholder="Masukkan Nama">
<div class="pointer"></div>
<canvas id="wheel" width="320" height="320"></canvas>
<button onclick="spin()">SPIN</button>
</div>

<div id="popup" class="popup">
<div class="card">
<h2 id="winner"></h2>
<p id="message"></p>
<h1 id="amount"></h1>
<button id="actionBtn">CLAIM</button>
</div>
</div>

<script>

/* ================= DATA ================= */

let playerRewards =
JSON.parse(localStorage.getItem("thrData")) || {};

let playerTurn = {};

const rewards=[
10000,20000,50000,0,100000,200000,500000,0
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

let spinning=false;
let visualRotation=0;

/* ================= DRAW WHEEL ================= */

const center=160;
const radius=160;

function draw(){
const arc=(Math.PI*2)/rewards.length;
const colors=[
"#ef4444","#22c55e","#3b82f6",
"#f59e0b","#a855f7","#111827",
"#14b8a6","#111827"
];

for(let i=0;i<rewards.length;i++){
ctx.beginPath();
ctx.fillStyle=colors[i];
ctx.moveTo(center,center);
ctx.arc(center,center,radius,i*arc,(i+1)*arc);
ctx.fill();

ctx.save();
ctx.translate(center,center);
ctx.rotate(i*arc+arc/2);
ctx.fillStyle="white";
ctx.font="bold 16px Arial";
ctx.fillText(
rewards[i]==0?"ZONK":
"Rp"+rewards[i].toLocaleString(),
70,5);
ctx.restore();
}
}
draw();

/* ================= SOUND SYSTEM (CLICK REALISTIC) ================= */

let audioCtx;

function playClick(){
if(!audioCtx){
audioCtx = new (window.AudioContext || window.webkitAudioContext)();
}

let osc = audioCtx.createOscillator();
let gain = audioCtx.createGain();

osc.type="triangle";
osc.frequency.value=1000;

gain.gain.setValueAtTime(0.2,audioCtx.currentTime);
gain.gain.exponentialRampToValueAtTime(0.001,audioCtx.currentTime+0.05);

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();
osc.stop(audioCtx.currentTime+0.05);
}

function startClickSound(duration){
let start=Date.now();
let delay=40;

function loop(){
let elapsed=Date.now()-start;
let progress=elapsed/duration;

playClick();

delay=40+(progress*200);

if(progress<1){
setTimeout(loop,delay);
}
}
loop();
}

/* ================= SPIN FUNCTION ================= */

function spin(){

if(spinning)return;

let name=document
.getElementById("playerName")
.value.trim().toLowerCase();

if(!name)return alert("Masukkan nama");

if(!playerTurn[name]) playerTurn[name]=1;

spinning=true;

startClickSound(6000);

let hadiah;

if(playerRewards[name]){
let data=playerRewards[name];

if(data.mode==="zonkFirst"
&& playerTurn[name]===1){
hadiah=0;
}else{
hadiah=data.hadiah;
}
}else{
hadiah=rewards[Math.floor(Math.random()*rewards.length)];
}

let index=rewards.indexOf(hadiah);

const slice=360/rewards.length;
const targetAngle=270-(index*slice)-(slice/2);

canvas.style.transition="none";
canvas.style.transform=`rotate(${visualRotation%360}deg)`;
canvas.offsetHeight;

visualRotation+=(8*360)+((targetAngle-(visualRotation%360)+360)%360);

canvas.style.transition="transform 6s cubic-bezier(.12,.95,.18,1)";
canvas.style.transform=`rotate(${visualRotation}deg)`;

setTimeout(()=>{

playerTurn[name]++;
showPopup(name,hadiah);

if(hadiah!==0){
confetti({particleCount:300});
}

spinning=false;

},6000);
}

/* ================= POPUP ================= */

function showPopup(name,amount){

let winner=document.getElementById("winner");
let message=document.getElementById("message");
let amountText=document.getElementById("amount");
let btn=document.getElementById("actionBtn");

winner.innerText=name.toUpperCase();

if(amount==0){

message.innerText="Maaf anda mendapat";
amountText.innerText="ZONK";
btn.innerText="COBA LAGI";

btn.onclick=function(){
document.getElementById("popup").classList.remove("show");
setTimeout(()=>{ spin(); },300);
};

}else{

message.innerText="Selamat anda mendapatkan";
amountText.innerText="Rp "+amount.toLocaleString();
btn.innerText="CLAIM";

btn.onclick=function(){
document.getElementById("popup").classList.remove("show");
document.getElementById("playerName").value="";
};

}

document.getElementById("popup").classList.add("show");
}

</script>
</body>
</html>
