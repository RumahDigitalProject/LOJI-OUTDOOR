<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dompet Pintar - Auto Save</title>
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #3498db;
            --danger: #e74c3c;
            --dark: #2c3e50;
            --light: #ecf0f1;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--light); padding: 20px; }
        .container { max-width: 500px; margin: auto; background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 5px; }
        p.subtitle { text-align: center; font-size: 12px; color: #888; margin-bottom: 20px; }
        
        .input-group { margin-bottom: 15px; display: flex; gap: 8px; }
        input, select { padding: 12px; border: 1px solid #ddd; border-radius: 8px; flex: 1; font-size: 14px; }
        
        button { padding: 12px; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; transition: 0.3s; }
        .btn-set { background: var(--primary); color: white; width: 100%; margin-bottom: 10px; }
        .btn-out { background: var(--danger); color: white; }
        .btn-reset { background: #95a5a6; color: white; width: 100%; font-size: 11px; margin-top: 20px; }

        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
        .card { background: #f9f9f9; padding: 15px; border-radius: 10px; border-left: 5px solid; }
        .card h4 { margin: 0; font-size: 12px; color: #777; text-transform: uppercase; }
        .card .balance { font-size: 16px; font-weight: bold; margin-top: 5px; }

        .history { border-top: 2px dashed #eee; padding-top: 15px; margin-top: 20px; }
        .history-item { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid #f1f1f1; font-size: 13px; }
    </style>
</head>
<body>

<div class="container">
    <h2>💰 Dompet Pintar</h2>
    <p class="subtitle">Data tersimpan otomatis di browser ini</p>
    
    <label style="font-size: 13px; font-weight: bold;">Update Gaji Bulanan:</label>
    <div class="input-group">
        <input type="number" id="inputGaji" placeholder="Masukkan Gaji (Contoh: 4000000)">
    </div>
    <button class="btn-set" onclick="aturGaji()">Set & Alokasikan Gaji</button>

    <div class="dashboard">
        <div class="card" style="border-color: #2ecc71;">
            <h4>Kebutuhan (50%)</h4>
            <div class="balance" id="bal-kebutuhan">Rp 0</div>
        </div>
        <div class="card" style="border-color: #3498db;">
            <h4>Tabungan (20%)</h4>
            <div class="balance" id="bal-tabungan">Rp 0</div>
        </div>
        <div class="card" style="border-color: #f1c40f;">
            <h4>Keinginan (20%)</h4>
            <div class="balance" id="bal-keinginan">Rp 0</div>
        </div>
        <div class="card" style="border-color: #e67e22;">
            <h4>Dana Darurat (10%)</h4>
            <div class="balance" id="bal-darurat">Rp 0</div>
        </div>
    </div>

    <div class="history">
        <h4 style="margin-bottom: 10px;">Catat Pengeluaran</h4>
        <div class="input-group">
            <select id="pilihKategori">
                <option value="kebutuhan">Kebutuhan</option>
                <option value="tabungan">Tabungan</option>
                <option value="keinginan">Keinginan</option>
                <option value="darurat">Darurat</option>
            </select>
            <input type="number" id="nominalKeluar" placeholder="Rp">
            <button class="btn-out" onclick="catatPengeluaran()">Catat</button>
        </div>
        <div id="logAktivitas"></div>
    </div>

    <button class="btn-reset" onclick="resetData()">Hapus Semua Data & Mulai Baru</button>
</div>

<script>
    // Load data dari LocalStorage saat halaman dibuka
    let saldo = JSON.parse(localStorage.getItem('dompetPintar_saldo')) || { kebutuhan: 0, tabungan: 0, keinginan: 0, darurat: 0 };
    let riwayat = JSON.parse(localStorage.getItem('dompetPintar_riwayat')) || [];

    function formatRupiah(angka) {
        return "Rp " + Math.round(angka).toLocaleString('id-ID');
    }

    function simpanKeStorage() {
        localStorage.setItem('dompetPintar_saldo', JSON.stringify(saldo));
        localStorage.setItem('dompetPintar_riwayat', JSON.stringify(riwayat));
    }

    function updateTampilan() {
        document.getElementById('bal-kebutuhan').innerText = formatRupiah(saldo.kebutuhan);
        document.getElementById('bal-tabungan').innerText = formatRupiah(saldo.tabungan);
        document.getElementById('bal-keinginan').innerText = formatRupiah(saldo.keinginan);
        document.getElementById('bal-darurat').innerText = formatRupiah(saldo.darurat);
        
        const log = document.getElementById('logAktivitas');
        log.innerHTML = "";
        riwayat.forEach(item => {
            const div = document.createElement('div');
            div.className = 'history-item';
            div.innerHTML = `<span>${item.ket}</span> <span>-${formatRupiah(item.nom)}</span>`;
            log.appendChild(div);
        });
    }

    function aturGaji() {
        const total = parseFloat(document.getElementById('inputGaji').value);
        if (!total || total <= 0) return alert("Masukkan nominal gaji!");

        saldo.kebutuhan = total * 0.5;
        saldo.tabungan = total * 0.2;
        saldo.keinginan = total * 0.2;
        saldo.darurat = total * 0.1;

        riwayat = []; // Reset riwayat saat set gaji baru
        simpanKeStorage();
        updateTampilan();
        alert("Gaji berhasil dialokasikan!");
    }

    function catatPengeluaran() {
        const kat = document.getElementById('pilihKategori').value;
        const nominal = parseFloat(document.getElementById('nominalKeluar').value);

        if (!nominal || nominal <= 0) return alert("Masukkan nominal!");
        if (nominal > saldo[kat]) return alert("Saldo tidak cukup!");

        saldo[kat] -= nominal;
        riwayat.unshift({ ket: kat.toUpperCase(), nom: nominal });
        
        if (riwayat.length > 5) riwayat.pop(); // Simpan 5 riwayat terakhir saja

        simpanKeStorage();
        updateTampilan();
        document.getElementById('nominalKeluar').value = "";
    }

    function resetData() {
        if(confirm("Apakah kamu yakin ingin menghapus semua catatan keuangan?")) {
            localStorage.clear();
            location.reload();
        }
    }

    // Inisialisasi tampilan awal
    updateTampilan();
</script>

</body>
</html>
