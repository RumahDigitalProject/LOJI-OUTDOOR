<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dompetku Intelligence</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --success: #10b981; --danger: #f43f5e; --warning: #f59e0b;
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 15px; padding-bottom: 80px; }
        .container { max-width: 480px; margin: auto; }
        
        header { margin: 10px 0 25px 0; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 24px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        
        .card { background: var(--card); border-radius: 24px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.04); border: 1px solid rgba(0,0,0,0.02); }
        .label { font-size: 10px; font-weight: 800; opacity: 0.5; text-transform: uppercase; margin-bottom: 10px; display: block; letter-spacing: 1px; }
        
        /* Dashboard */
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .b-item { padding: 14px; border-radius: 18px; background: rgba(99, 102, 241, 0.03); border: 1px solid rgba(0,0,0,0.03); }
        .b-item span { font-size: 11px; font-weight: 600; opacity: 0.7; }
        .b-item p { font-size: 15px; font-weight: 800; margin: 4px 0; }
        
        input, select { width: 100%; background: var(--bg); border: 2px solid transparent; color: var(--text); padding: 14px; border-radius: 16px; margin-bottom: 10px; font-size: 15px; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--primary); background: var(--card); }
        
        .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 14px; }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: transparent; border: 1.5px solid var(--primary); color: var(--primary); margin-top: 10px; }
        
        .history-item { display: flex; justify-content: space-between; padding: 15px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .history-item b { font-size: 14px; display: block; }
        .history-item small { opacity: 0.5; font-size: 11px; font-weight: 600; }
        .amt { text-align: right; font-weight: 800; font-size: 14px; }

        .stats-highlight { background: var(--primary); color: white; padding: 15px; border-radius: 18px; margin-bottom: 15px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Dompetku.</h1>
            <p id="today" style="font-size: 12px; opacity: 0.6; font-weight: 600;"></p>
        </div>
        <div style="font-size: 20px;">📊</div>
    </header>

    <div class="card">
        <span class="label">Total Saldo Terkumpul</span>
        <div class="balance-grid">
            <div class="b-item"><span>Wajib</span><p id="v-kebutuhan">0</p></div>
            <div class="b-item"><span>Tabung</span><p id="v-tabungan">0</p></div>
            <div class="b-item"><span>Keinginan</span><p id="v-keinginan">0</p></div>
            <div class="b-item"><span>Darurat</span><p id="v-darurat">0</p></div>
        </div>
    </div>

    <div class="card">
        <span class="label">Input Gaji & Alokasi</span>
        <input type="number" id="inGaji" placeholder="Masukkan Gaji UMR">
        <button class="btn btn-primary" onclick="tambahGaji()">Alokasikan Otomatis</button>
    </div>

    <div class="card">
        <span class="label">Transaksi Baru</span>
        <select id="katKeluar">
            <option value="kebutuhan">Kebutuhan (50%)</option>
            <option value="tabungan">Tabungan (20%)</option>
            <option value="keinginan">Keinginan (20%)</option>
            <option value="darurat">Darurat (10%)</option>
        </select>
        <input type="text" id="ketKeluar" list="hintList" placeholder="Keterangan (misal: Lauk)">
        <datalist id="hintList"></datalist>
        <input type="number" id="nomKeluar" placeholder="Nominal Rp">
        <button class="btn btn-success" onclick="catat()">Simpan Pengeluaran</button>
    </div>

    <div class="card">
        <span class="label">Laporan & Filter</span>
        <div style="display: flex; gap: 8px;">
            <select id="fBulan" onchange="update()">
                <option value="all">Semua Bulan</option>
                <option value="1">Januari</option><option value="2">Februari</option><option value="3">Maret</option>
                <option value="4">April</option><option value="5">Mei</option><option value="6">Juni</option>
                <option value="7">Juli</option><option value="8">Agustus</option><option value="9">September</option>
                <option value="10">Oktober</option><option value="11">November</option><option value="12">Desember</option>
            </select>
            <input type="text" id="fKeyword" onkeyup="update()" placeholder="Cari data..." style="margin-bottom:0;">
        </div>
        
        <div id="statsBox" class="stats-highlight" style="display:none; margin-top:15px;">
            <small style="font-weight:700; opacity:0.8;">Total Terfilter:</small>
            <h2 id="totalFiltered" style="font-size: 24px;">Rp 0</h2>
        </div>

        <button class="btn btn-outline" onclick="unduhLaporan()">📥 Unduh Laporan (.csv)</button>

        <div id="logList" style="margin-top:20px;"></div>
    </div>

    <button onclick="hapusSemua()" style="background:none; border:none; color:var(--danger); font-size: 11px; width: 100%; font-weight: 700; margin-top: 20px; opacity: 0.5;">RESET SEMUA DATA APLIKASI</button>
</div>

<script>
    let db = JSON.parse(localStorage.getItem('dompet_pro_v3')) || {
        saldo: { kebutuhan: 0, tabungan: 0, keinginan: 0, darurat: 0 },
        logs: [], hints: []
    };

    const fmt = (n) => "Rp " + Math.round(n).toLocaleString('id-ID');

    function update() {
        // Dashboard
        document.getElementById('v-kebutuhan').innerText = fmt(db.saldo.kebutuhan);
        document.getElementById('v-tabungan').innerText = fmt(db.saldo.tabungan);
        document.getElementById('v-keinginan').innerText = fmt(db.saldo.keinginan);
        document.getElementById('v-darurat').innerText = fmt(db.saldo.darurat);

        // Filter
        const fMonth = document.getElementById('fBulan').value;
        const fKey = document.getElementById('fKeyword').value.toLowerCase();
        const logList = document.getElementById('logList');
        let totalF = 0;

        logList.innerHTML = "";
        db.logs.forEach(l => {
            const matchMonth = fMonth === 'all' || l.month === fMonth;
            const matchKey = l.ket.toLowerCase().includes(fKey);

            if (matchMonth && matchKey) {
                if(l.type === 'out') totalF += l.amt;
                logList.innerHTML += `
                    <div class="history-item">
                        <div>
                            <b>${l.ket}</b>
                            <small>${l.date} | ${l.kat.toUpperCase()}</small>
                        </div>
                        <div class="amt" style="color:${l.type==='in'?'var(--success)':'var(--danger)'}">
                            ${l.type==='in'?'+':'-'}${fmt(l.amt)}
                        </div>
                    </div>`;
            }
        });

        const statsBox = document.getElementById('statsBox');
        if(fKey !== "" || fMonth !== 'all') {
            statsBox.style.display = "block";
            document.getElementById('totalFiltered').innerText = fmt(totalF);
        } else { statsBox.style.display = "none"; }

        // Hints
        const hintList = document.getElementById('hintList');
        hintList.innerHTML = "";
        [...new Set(db.hints)].forEach(h => { hintList.innerHTML += `<option value="${h}">`; });

        localStorage.setItem('dompet_pro_v3', JSON.stringify(db));
    }

    function tambahGaji() {
        const amt = parseFloat(document.getElementById('inGaji').value);
        if(!amt) return;
        const now = new Date();
        const dateStr = now.toLocaleDateString('id-ID') + " " + now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
        
        db.saldo.kebutuhan += amt * 0.5; db.saldo.tabungan += amt * 0.2;
        db.saldo.keinginan += amt * 0.2; db.saldo.darurat += amt * 0.1;

        db.logs.unshift({ 
            type: 'in', month: (now.getMonth()+1).toString(), 
            date: dateStr, ket: 'Gaji Masuk', kat: 'pemasukan', amt: amt 
        });
        
        document.getElementById('inGaji').value = "";
        update(); alert("Gaji berhasil masuk!");
    }

    function catat() {
        const kat = document.getElementById('katKeluar').value;
        const ket = document.getElementById('ketKeluar').value;
        const nom = parseFloat(document.getElementById('nomKeluar').value);
        if(!ket || !nom) return alert("Lengkapi data!");
        if(nom > db.saldo[kat]) return alert("Saldo tidak cukup!");

        const now = new Date();
        const dateStr = now.toLocaleDateString('id-ID') + " " + now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});

        db.saldo[kat] -= nom;
        db.logs.unshift({ 
            type: 'out', month: (now.getMonth()+1).toString(), 
            date: dateStr, ket: ket, kat: kat, amt: nom 
        });
        
        if(!db.hints.includes(ket)) db.hints.push(ket);
        document.getElementById('ketKeluar').value = "";
        document.getElementById('nomKeluar').value = "";
        update();
    }

    function unduhLaporan() {
        const fMonth = document.getElementById('fBulan').value;
        const fKey = document.getElementById('fKeyword').value.toLowerCase();
        
        let csvContent = "Tanggal,Kategori,Keterangan,Tipe,Nominal\n";
        
        db.logs.forEach(l => {
            if((fMonth === 'all' || l.month === fMonth) && l.ket.toLowerCase().includes(fKey)) {
                csvContent += `${l.date},${l.kat},${l.ket},${l.type === 'in' ? 'Masuk' : 'Keluar'},${l.amt}\n`;
            }
        });

        const blob = new Blob([csvContent], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement("a");
        const url = URL.createObjectURL(blob);
        link.setAttribute("href", url);
        link.setAttribute("download", `Laporan_Keuangan_${fMonth}.csv`);
        link.style.visibility = 'hidden';
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
    }

    function hapusSemua() {
        if(confirm("PERINGATAN: Semua data keuangan kamu akan dihapus permanen. Lanjutkan?")) {
            localStorage.clear(); location.reload();
        }
    }

    document.getElementById('today').innerText = new Intl.DateTimeFormat('id-ID', { dateStyle: 'full' }).format(new Date());
    update();
</script>

</body>
</html>
