<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dompetku Neon Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --accent: #a855f7; 
            --success: #10b981; --danger: #f43f5e; 
            --warning: #f59e0b; --parent: #ec4899; --cyan: #0ea5e9;
            --bg-gradient: linear-gradient(135deg, #1e1b4b 0%, #312e81 100%);
            --glass: rgba(20, 20, 40, 0.6); 
            --text: #f8fafc;
        }
        
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg-gradient); background-attachment: fixed; color: var(--text); padding: 15px; min-height: 100vh; overflow-x: hidden; }
        .container { max-width: 480px; margin: auto; }
        
        header { margin-bottom: 25px; text-align: center; color: white; text-shadow: 0 4px 15px rgba(0,0,0,0.3); }
        header h1 { font-size: 34px; font-weight: 900; letter-spacing: -1px; background: linear-gradient(to right, #a855f7, #ec4899); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        
        .status-cloud { font-size: 10px; font-weight: 800; padding: 6px 15px; border-radius: 50px; background: rgba(0,0,0,0.3); color: white; display: inline-block; margin-top: 10px; backdrop-filter: blur(5px); border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .online { border-color: var(--success); color: var(--success); box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }

        .card { background: var(--glass); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border-radius: 30px; padding: 20px; margin-bottom: 20px; box-shadow: 0 20px 40px rgba(0,0,0,0.2); border: 1px solid rgba(255,255,255,0.05); }
        .label { font-size: 12px; font-weight: 800; opacity: 0.8; text-transform: uppercase; margin-bottom: 0; letter-spacing: 1.5px; color: #94a3b8; }
        
        .dash-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .filter-mini { width: auto; padding: 8px 10px; margin-bottom: 0; font-size: 11px; border-radius: 12px; background: rgba(0,0,0,0.4); color: var(--accent); border: 1px solid var(--accent); cursor: pointer; text-transform: uppercase; font-weight: 800; }

        /* Dashboard Grid */
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .b-item { padding: 15px; border-radius: 20px; position: relative; overflow: hidden; box-shadow: 0 10px 20px rgba(0,0,0,0.2); transition: 0.3s; display: flex; flex-direction: column; justify-content: center; }
        .b-item::before { content: ''; position: absolute; top: 0; left: 0; right: 0; bottom: 0; opacity: 0.15; z-index: 0; }
        .b-item > * { position: relative; z-index: 1; }
        
        .b-item span { font-size: 10px; font-weight: 800; opacity: 0.9; letter-spacing: 0.5px; display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
        
        /* FIX: Angka tidak akan kepotong (ellipsis dihapus) */
        .b-item p { 
            font-size: clamp(12px, 4.2vw, 18px); /* Minimum font size diturunkan jadi 12px agar lebih muat banyak */
            font-weight: 900; 
            margin: 4px 0; 
            word-break: break-all; /* Jika sudah mentok, angka diizinkan turun ke bawah agar terlihat semua */
            text-shadow: 0 2px 10px rgba(0,0,0,0.5); 
            width: 100%;
            line-height: 1.2;
        }
        
        .card-total { background: linear-gradient(135deg, rgba(14, 165, 233, 0.2), rgba(2, 132, 199, 0.4)); border: 1px solid rgba(14, 165, 233, 0.5); grid-column: span 2; text-align: center; align-items: center; padding: 20px 15px; }
        .card-total p { color: #38bdf8; font-size: clamp(20px, 6vw, 26px); word-break: normal; } 
        .card-total span { justify-content: center; font-size: 12px; }

        .card-wajib { background: linear-gradient(135deg, rgba(16, 185, 129, 0.2), rgba(5, 150, 105, 0.4)); border: 1px solid rgba(16, 185, 129, 0.5); }
        .card-wajib p { color: #34d399; }
        .card-main { background: linear-gradient(135deg, rgba(168, 85, 247, 0.2), rgba(236, 72, 153, 0.4)); border: 1px solid rgba(236, 72, 153, 0.5); }
        .card-main p { color: #f472b6; }
        .card-tabung { background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(59, 130, 246, 0.4)); border: 1px solid rgba(99, 102, 241, 0.5); }
        .card-tabung p { color: #818cf8; }
        .card-ortu { background: linear-gradient(135deg, rgba(245, 158, 11, 0.2), rgba(217, 119, 6, 0.4)); border: 1px solid rgba(245, 158, 11, 0.5); }
        .card-ortu p { color: #fbbf24; }
        .card-darurat { background: linear-gradient(135deg, rgba(244, 63, 94, 0.2), rgba(225, 29, 72, 0.4)); border: 1px solid rgba(244, 63, 94, 0.5); grid-column: span 2; align-items: center; }
        .card-darurat p { color: #fda4af; font-size: clamp(18px, 5vw, 22px); text-align: center; word-break: normal; }
        .card-darurat span { justify-content: center; }

        .progress-container { width: 100%; height: 6px; background: rgba(0,0,0,0.3); border-radius: 10px; overflow: hidden; margin-top: 8px; box-shadow: inset 0 1px 3px rgba(0,0,0,0.5); }
        .progress-fill { height: 100%; width: 0%; transition: 1s cubic-bezier(0.4, 0, 0.2, 1); border-radius: 10px; box-shadow: 0 0 10px currentColor; }

        input, select { width: 100%; background: rgba(0,0,0,0.2); border: 2px solid rgba(255,255,255,0.1); color: white; padding: 16px; border-radius: 18px; margin-bottom: 12px; font-size: 15px; font-weight: 700; outline: none; transition: 0.3s; }
        input:focus { border-color: var(--accent); background: rgba(0,0,0,0.4); box-shadow: 0 0 15px rgba(168, 85, 247, 0.3); }
        input::placeholder { color: rgba(255,255,255,0.4); }
        select option { background: #1e1b4b; color: white; font-weight: 700; }

        .btn { width: 100%; padding: 18px; border-radius: 18px; border: none; font-weight: 900; cursor: pointer; transition: 0.2s; font-size: 15px; text-transform: uppercase; letter-spacing: 1.5px; }
        .btn-primary { background: linear-gradient(135deg, var(--primary), var(--accent)); color: white; box-shadow: 0 8px 25px rgba(168, 85, 247, 0.4); }
        .btn-success { background: linear-gradient(135deg, #10b981, #059669); color: white; box-shadow: 0 8px 25px rgba(16, 185, 129, 0.4); margin-top: 5px; }
        .btn-outline { background: rgba(0,0,0,0.2); border: 2px solid var(--accent); color: #e879f9; margin-top: 15px; }
        .btn:active { transform: scale(0.95); }

        /* History Styling */
        .history-item { display: flex; justify-content: space-between; align-items: center; padding: 16px; background: rgba(0,0,0,0.2); border-radius: 18px; margin-bottom: 10px; border: 1px solid rgba(255,255,255,0.05); }
        .history-item .info { flex: 1; min-width: 0; padding-right: 8px; }
        .history-item b { font-size: 14px; font-weight: 800; display: block; color: white; word-break: break-word; line-height: 1.4; margin-bottom: 4px; }
        .history-item small { opacity: 0.6; font-size: 10px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; display: block; }
        
        .history-right { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .amt { font-weight: 900; font-size: 13px; white-space: nowrap; background: rgba(0,0,0,0.4); padding: 8px 12px; border-radius: 12px; display: flex; align-items: center; border: 1px solid rgba(255,255,255,0.1); }
        
        .action-btns { display: flex; gap: 5px; }
        .btn-mini { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.1); color: white; padding: 6px; border-radius: 8px; cursor: pointer; transition: 0.2s; font-size: 12px; display: flex; align-items: center; justify-content: center; }
        .btn-mini:hover { background: rgba(255,255,255,0.3); }
        .btn-mini:active { transform: scale(0.9); }

        .stats-highlight { background: linear-gradient(45deg, var(--danger), var(--warning)); color: white; padding: 25px; border-radius: 25px; margin-top: 15px; text-align: center; box-shadow: 0 10px 30px rgba(244, 63, 94, 0.3); }

        /* MODAL POP-UP UNTUK EDIT */
        .modal-overlay {
            position: fixed; top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center; z-index: 1000; padding: 20px;
        }
        .modal-card {
            width: 100%; max-width: 400px; margin: 0; animation: popIn 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            background: var(--bg-gradient); border: 1px solid rgba(255,255,255,0.2); box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        @keyframes popIn { from { transform: scale(0.9); opacity: 0; } to { transform: scale(1); opacity: 1; } }
        
    </style>
</head>
<body>

<div id="editModal" class="modal-overlay">
    <div class="modal-card card">
        <h3 style="margin-bottom: 20px; text-align: center; color: white; font-weight: 900; letter-spacing: 1px;">✏️ EDIT DATA</h3>
        <input type="hidden" id="editIndex">
        
        <label class="label">Kategori</label>
        <select id="editKat">
            </select>
        
        <label class="label">Nama / Keterangan</label>
        <input type="text" id="editKet" placeholder="Masukkan keterangan baru...">
        
        <label class="label">Nominal (Rp)</label>
        <input type="number" id="editNom" placeholder="Nominal Rp...">
        
        <div style="display: flex; gap: 10px; margin-top: 15px;">
            <button class="btn btn-outline" style="margin-top:0; border-color: rgba(255,255,255,0.3); color: white;" onclick="closeModal()">BATAL</button>
            <button class="btn btn-success" style="margin-top:0;" onclick="saveEdit()">SIMPAN PERUBAHAN</button>
        </div>
    </div>
</div>

<div class="container">
    <header>
        <h1>DOMPETKU 🚀</h1>
        <div id="status" class="status-cloud">MENYAMBUNG CLOUD...</div>
    </header>

    <div class="card">
        <div class="dash-header">
            <span class="label">💳 Dashboard Saldo</span>
            <select id="fBulanDash" class="filter-mini" onchange="update()"></select>
        </div>
        
        <div class="balance-grid">
            <div class="b-item card-total">
                <span id="title-gaji">🌟 TOTAL GAJI TERKUMPUL</span>
                <p id="v-totalgaji">0</p>
            </div>
            <div class="b-item card-wajib">
                <span>🟢 WAJIB (45%)</span><p id="v-wajib">0</p>
                <div class="progress-container"><div id="p-wajib" class="progress-fill" style="background:var(--success); color:var(--success);"></div></div>
            </div>
            <div class="b-item card-main">
                <span>🎮 MAIN (20%)</span><p id="v-main">0</p>
                <div class="progress-container"><div id="p-main" class="progress-fill" style="background:#f472b6; color:#f472b6;"></div></div>
            </div>
            <div class="b-item card-tabung">
                <span>💎 TABUNG (20%)</span><p id="v-tabung">0</p>
                <div class="progress-container"><div id="p-tabung" class="progress-fill" style="background:var(--primary); color:var(--primary);"></div></div>
            </div>
            <div class="b-item card-ortu">
                <span>👨‍👩‍👧 ORTU (10%)</span><p id="v-ortu">0</p>
                <div class="progress-container"><div id="p-ortu" class="progress-fill" style="background:var(--warning); color:var(--warning);"></div></div>
            </div>
            <div class="b-item card-darurat">
                <span>🔥 DARURAT (5%)</span><p id="v-darurat">0</p>
                <div class="progress-container"><div id="p-darurat" class="progress-fill" style="background:var(--danger); color:var(--danger);"></div></div>
            </div>
        </div>
    </div>

    <div class="card">
        <span class="label" style="margin-bottom: 12px;">📥 Masukkan Pendapatan</span>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="inGaji" placeholder="Nominal Gaji...">
            <select id="blnGaji" style="width: 140px;"></select>
        </div>
        <button class="btn btn-primary" onclick="tambahGaji()">ALOKASIKAN & SINKRON</button>
    </div>

    <div class="card">
        <span class="label" style="margin-bottom: 12px;">💸 Catat Pengeluaran</span>
        <select id="katKeluar">
            <option value="wajib">🟢 Wajib (Makan, Kos, dll)</option>
            <option value="main">🎮 Main (Game, Hobi, Nongkrong)</option>
            <option value="tabung">💎 Tabungan (Masa Depan)</option>
            <option value="ortu">👨‍👩‍👧 Orang Tua</option>
            <option value="darurat">🔥 Darurat (Mendesak)</option>
        </select>
        <input type="text" id="ketKeluar" list="hintList" placeholder="Keterangan (misal: Beli Kopi)">
        <datalist id="hintList"></datalist>
        <input type="number" id="nomKeluar" placeholder="Nominal Rp...">
        <button class="btn btn-success" onclick="catat()">SIMPAN TRANSAKSI</button>
    </div>

    <div class="card">
        <span class="label" style="margin-bottom: 12px;">📊 Riwayat & Analisis</span>
        <div style="display: flex; gap: 8px; margin-bottom: 15px;">
            <select id="fBulan" onchange="update()"></select>
            <input type="text" id="fKeyword" onkeyup="update()" placeholder="Cari data..." style="margin-bottom:0;">
        </div>
        
        <div id="statsBox" class="stats-highlight" style="display:none;">
            <small style="font-weight:800; opacity:0.9; letter-spacing:1px; text-transform:uppercase;">Total Terfilter</small>
            <h2 id="totalFiltered" style="font-size: 32px; font-weight: 900; margin-top:5px; text-shadow: 0 2px 10px rgba(0,0,0,0.3);">Rp 0</h2>
        </div>

        <button class="btn btn-outline" onclick="unduhLaporan()">📥 DOWNLOAD LAPORAN (CSV)</button>
        <div id="logList" style="margin-top:15px;"></div>
    </div>

    <button onclick="hapusSemua()" style="background:none; border:none; color:#94a3b8; font-size: 11px; width: 100%; font-weight: 800; margin: 20px 0 40px 0; opacity: 0.5; text-decoration: underline; letter-spacing: 1px;">RESET SEMUA DATA SERVER & HP</button>
</div>

<script>
    const URL_CLOUD = "https://script.google.com/macros/s/AKfycbxVDw1tDrqVeVsuwMGTUtuuSSfU9uBdHCXK4cfgwGLoTcMbio0LuXo0sWLiS83GveSc/exec";

    let db = JSON.parse(localStorage.getItem('dompet_neon_v12')) || {
        saldo: { wajib: 0, main: 0, tabung: 0, ortu: 0, darurat: 0 },
        initial: { wajib: 0, main: 0, tabung: 0, ortu: 0, darurat: 0 },
        totalGaji: 0, logs: [], hints: []
    };
    if(db.totalGaji === undefined) db.totalGaji = 0;

    const fmt = (n) => "Rp " + Math.round(n).toLocaleString('id-ID');

    async function kirimCloud(payload) {
        const s = document.getElementById('status');
        s.innerText = "☁️ SINKRONISASI...";
        s.classList.remove('online');
        try {
            await fetch(URL_CLOUD, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            s.innerText = "✅ CLOUD TERHUBUNG";
            s.classList.add('online');
        } catch (e) { s.innerText = "❌ ERROR CLOUD"; }
    }

    function update() {
        const fDash = document.getElementById('fBulanDash').value;
        const dashTitle = document.getElementById('title-gaji');
        
        let dSaldo = { wajib: 0, main: 0, tabung: 0, ortu: 0, darurat: 0 };
        let dInit = { wajib: 0, main: 0, tabung: 0, ortu: 0, darurat: 0 };
        let dGaji = 0;

        if (fDash === 'all') {
            dSaldo = { ...db.saldo }; dInit = { ...db.initial }; dGaji = db.totalGaji;
            dashTitle.innerText = "🌟 TOTAL GAJI TERKUMPUL";
        } else {
            db.logs.forEach(l => {
                if (l.month === fDash) {
                    if (l.type === 'IN') {
                        dGaji += l.amt;
                        dInit.wajib += l.amt * 0.45; dInit.main += l.amt * 0.2; dInit.tabung += l.amt * 0.2; dInit.ortu += l.amt * 0.1; dInit.darurat += l.amt * 0.05;
                        dSaldo.wajib += l.amt * 0.45; dSaldo.main += l.amt * 0.2; dSaldo.tabung += l.amt * 0.2; dSaldo.ortu += l.amt * 0.1; dSaldo.darurat += l.amt * 0.05;
                    } else if (l.type === 'OUT') {
                        dSaldo[l.kat] -= l.amt;
                    }
                }
            });
            const namaBulan = document.getElementById('fBulanDash').options[document.getElementById('fBulanDash').selectedIndex].text;
            dashTitle.innerText = "🌟 GAJI BULAN " + namaBulan;
        }

        document.getElementById('v-totalgaji').innerText = fmt(dGaji);
        ['wajib','main','tabung','ortu','darurat'].forEach(id => {
            document.getElementById('v-'+id).innerText = fmt(dSaldo[id]);
            const perc = dInit[id] > 0 ? (dSaldo[id] / dInit[id]) * 100 : 0;
            document.getElementById('p-'+id).style.width = Math.min(Math.max(perc, 0), 100) + "%";
        });

        const fMonth = document.getElementById('fBulan').value;
        const fKey = document.getElementById('fKeyword').value.toLowerCase();
        const logList = document.getElementById('logList');
        let totalF = 0;

        logList.innerHTML = "";
        db.logs.forEach((l, index) => {
            if((fMonth === 'all' || l.month === fMonth) && l.ket.toLowerCase().includes(fKey)) {
                if(l.type === 'OUT') totalF += l.amt;
                logList.innerHTML += `
                    <div class="history-item">
                        <div class="info"><b>${l.ket}</b><small>${l.date} | ${l.kat}</small></div>
                        <div class="history-right">
                            <div class="amt" style="color:${l.type==='IN'?'#34d399':'#fb7185'}">
                                ${l.type==='IN'?'+':'-'}${fmt(l.amt)}
                            </div>
                            <div class="action-btns">
                                <button class="btn-mini" onclick="openModal(${index})" title="Edit Transaksi">✏️</button>
                                <button class="btn-mini" onclick="deleteLog(${index})" title="Hapus Transaksi">🗑️</button>
                            </div>
                        </div>
                    </div>`;
            }
        });

        document.getElementById('statsBox').style.display = (fKey || fMonth !== 'all') ? "block" : "none";
        document.getElementById('totalFiltered').innerText = fmt(totalF);

        const hintList = document.getElementById('hintList');
        hintList.innerHTML = "";
        [...new Set(db.hints)].slice(0, 15).forEach(h => { hintList.innerHTML += `<option value="${h}">`; });

        localStorage.setItem('dompet_neon_v12', JSON.stringify(db));
    }

    // --- POP-UP EDIT FITUR (KATEGORI SEKARANG BISA DIGANTI) ---
    function openModal(index) {
        const l = db.logs[index];
        document.getElementById('editIndex').value = index;
        document.getElementById('editKet').value = l.ket;
        document.getElementById('editNom').value = l.amt;
        
        const katSelect = document.getElementById('editKat');
        katSelect.innerHTML = ""; // Bersihkan opsi lama
        
        if (l.type === 'IN') {
            // Jika yang diedit adalah Gaji Masuk, tetap kunci di Pemasukan
            katSelect.innerHTML = `<option value="PEMASUKAN">🌟 PEMASUKAN GAJI</option>`;
            katSelect.disabled = true;
            katSelect.style.opacity = "0.6";
        } else {
            // Jika pengeluaran, buka kunci dan berikan semua opsi
            katSelect.disabled = false;
            katSelect.style.opacity = "1";
            katSelect.innerHTML = `
                <option value="wajib" ${l.kat === 'wajib' ? 'selected' : ''}>🟢 Wajib</option>
                <option value="main" ${l.kat === 'main' ? 'selected' : ''}>🎮 Main</option>
                <option value="tabung" ${l.kat === 'tabung' ? 'selected' : ''}>💎 Tabung</option>
                <option value="ortu" ${l.kat === 'ortu' ? 'selected' : ''}>👨‍👩‍👧 Ortu</option>
                <option value="darurat" ${l.kat === 'darurat' ? 'selected' : ''}>🔥 Darurat</option>
            `;
        }
        
        document.getElementById('editModal').style.display = "flex";
    }

    function closeModal() { document.getElementById('editModal').style.display = "none"; }

    function saveEdit() {
        const index = document.getElementById('editIndex').value;
        const newKet = document.getElementById('editKet').value;
        const newAmt = parseFloat(document.getElementById('editNom').value);
        const newKat = document.getElementById('editKat').value; // Mengambil kategori baru
        
        if (!newKet || isNaN(newAmt) || newAmt < 0) return alert("Mohon isi keterangan dan nominal dengan benar!");

        let l = db.logs[index];
        
        // 1. Tarik kembali uang lama dari kategori LAMA
        if(l.type === 'IN') {
            db.totalGaji -= l.amt;
            const w = l.amt*0.45, m = l.amt*0.2, t = l.amt*0.2, o = l.amt*0.1, d = l.amt*0.05;
            db.saldo.wajib -= w; db.saldo.main -= m; db.saldo.tabung -= t; db.saldo.ortu -= o; db.saldo.darurat -= d;
            db.initial.wajib -= w; db.initial.main -= m; db.initial.tabung -= t; db.initial.ortu -= o; db.initial.darurat -= d;
        } else {
            db.saldo[l.kat] += l.amt; // Kembalikan saldo ke kategori yang lama
        }

        // 2. Terapkan angka baru ke kategori BARU
        if(l.type === 'IN') {
            db.totalGaji += newAmt;
            const w = newAmt*0.45, m = newAmt*0.2, t = newAmt*0.2, o = newAmt*0.1, d = newAmt*0.05;
            db.saldo.wajib += w; db.saldo.main += m; db.saldo.tabung += t; db.saldo.ortu += o; db.saldo.darurat += d;
            db.initial.wajib += w; db.initial.main += m; db.initial.tabung += t; db.initial.ortu += o; db.initial.darurat += d;
        } else {
            if(newAmt > db.saldo[newKat]) { // Cek saldo di kategori yang baru
                alert("Gagal Edit: Nominal baru lebih besar dari sisa saldo di kategori " + newKat.toUpperCase() + "!");
                db.saldo[l.kat] -= l.amt; // Rollback ke keadaan awal
                closeModal();
                return update(); 
            }
            db.saldo[newKat] -= newAmt; // Kurangi saldo di kategori yang baru
        }

        // 3. Simpan perubahan ke history
        l.ket = newKet;
        l.amt = newAmt;
        l.kat = newKat; // Update kategori di log

        kirimCloud({ date: l.date, kat: l.kat, ket: "[DIEDIT] " + l.ket, type: 'CORRECTION', amt: l.amt, month: l.month });
        
        closeModal();
        update();
    }

    function deleteLog(index) {
        if(!confirm("Hapus transaksi ini? Saldo akan dikembalikan secara otomatis.")) return;
        let l = db.logs[index];
        
        if(l.type === 'IN') {
            db.totalGaji -= l.amt;
            const w = l.amt*0.45, m = l.amt*0.2, t = l.amt*0.2, o = l.amt*0.1, d = l.amt*0.05;
            db.saldo.wajib -= w; db.saldo.main -= m; db.saldo.tabung -= t; db.saldo.ortu -= o; db.saldo.darurat -= d;
            db.initial.wajib -= w; db.initial.main -= m; db.initial.tabung -= t; db.initial.ortu -= o; db.initial.darurat -= d;
        } else {
            db.saldo[l.kat] += l.amt; 
        }

        kirimCloud({ date: l.date, kat: l.kat, ket: "[DIHAPUS] " + l.ket, type: 'CORRECTION', amt: 0, month: l.month });
        db.logs.splice(index, 1);
        update();
    }

    function tambahGaji() {
        const amt = parseFloat(document.getElementById('inGaji').value);
        const blnDropdown = document.getElementById('blnGaji');
        const blnVal = blnDropdown.value;
        const blnText = blnDropdown.options[blnDropdown.selectedIndex].text; 

        if(!amt) return;
        
        const now = new Date();
        const dateStr = now.toLocaleDateString('id-ID', {day:'2-digit', month:'2-digit'}) + " " + now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
        
        const w = amt * 0.45, m = amt * 0.2, t = amt * 0.2, o = amt * 0.1, d = amt * 0.05;
        db.saldo.wajib += w; db.saldo.main += m; db.saldo.tabung += t; db.saldo.ortu += o; db.saldo.darurat += d;
        db.initial.wajib += w; db.initial.main += m; db.initial.tabung += t; db.initial.ortu += o; db.initial.darurat += d;
        db.totalGaji += amt;
        
        const payload = { date: dateStr, kat: 'PEMASUKAN', ket: "Gaji Bulan " + blnText, type: 'IN', amt: amt, month: blnVal };
        db.logs.unshift(payload);
        kirimCloud(payload);
        document.getElementById('inGaji').value = "";
        update();
    }

    function catat() {
        const kat = document.getElementById('katKeluar').value;
        const ket = document.getElementById('ketKeluar').value;
        const nom = parseFloat(document.getElementById('nomKeluar').value);
        const bln = document.getElementById('blnGaji').value; 

        if(!ket || !nom) return;
        if(nom > db.saldo[kat]) return alert("Waduh, saldo " + kat.toUpperCase() + " kamu nggak cukup nih!");

        const now = new Date();
        const dateStr = now.toLocaleDateString('id-ID', {day:'2-digit', month:'2-digit'}) + " " + now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});

        db.saldo[kat] -= nom;
        const payload = { date: dateStr, kat: kat, ket: ket, type: 'OUT', amt: nom, month: bln };
        db.logs.unshift(payload);
        if(!db.hints.includes(ket)) db.hints.push(ket);
        kirimCloud(payload);
        document.getElementById('ketKeluar').value = "";
        document.getElementById('nomKeluar').value = "";
        update();
    }

    function unduhLaporan() {
        let csv = "Tanggal,Kategori,Keterangan,Tipe,Nominal\n";
        db.logs.forEach(l => { csv += `${l.date},${l.kat},${l.ket},${l.type},${l.amt}\n`; });
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Laporan_Keuangan_Neon.csv`;
        link.click();
    }

    async function hapusSemua() {
        if(confirm("Yakin mau hapus semua data dari HP dan Server Google? Data nggak bisa balik lagi loh!")) {
            try {
                await fetch(URL_CLOUD, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "RESET" }) });
                localStorage.clear(); location.reload();
            } catch (e) { alert("Gagal konek ke Cloud!"); }
        }
    }

    const months = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    const blnGaji = document.getElementById('blnGaji');
    const fBulan = document.getElementById('fBulan');
    const fBulanDash = document.getElementById('fBulanDash');
    
    fBulan.innerHTML = `<option value="all">SEMUA BULAN</option>`;
    fBulanDash.innerHTML = `<option value="all">SEMUA BULAN</option>`;
    
    months.forEach((m, i) => {
        const opt = `<option value="${i+1}">${m.toUpperCase()}</option>`;
        blnGaji.innerHTML += opt;
        fBulan.innerHTML += opt;
        fBulanDash.innerHTML += opt;
    });

    document.getElementById('blnGaji').value = new Date().getMonth() + 1;
    update();
</script>
