<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dompetku Pro</title>
    <style>
        :root {
            --bg: #f0f2f5;
            --card-bg: #ffffff;
            --primary: #4e73df;
            --success: #1cc88a;
            --danger: #e74a3b;
            --text-main: #3a3b45;
        }
        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
        body { 
            font-family: 'Inter', -apple-system, sans-serif; 
            background: var(--bg); color: var(--text-main); 
            margin: 0; padding: 15px; overflow-x: hidden;
        }
        .app-container { max-width: 480px; margin: auto; }
        
        h2 { font-weight: 800; color: var(--primary); margin-bottom: 5px; }
        .card { 
            background: var(--card-bg); border-radius: 20px; 
            padding: 20px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); margin-bottom: 15px; 
        }
        
        label { display: block; font-size: 12px; font-weight: 700; margin-bottom: 8px; color: #888; text-transform: uppercase; }
        input, select { 
            width: 100%; padding: 12px; border: 1.5px solid #eee; 
            border-radius: 12px; margin-bottom: 10px; font-size: 16px; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); }
        
        .btn { 
            width: 100%; padding: 14px; border: none; border-radius: 12px; 
            font-weight: 700; font-size: 16px; cursor: pointer; transition: 0.2s; 
        }
        .btn-primary { background: var(--primary); color: white; }
        .btn-success { background: var(--success); color: white; }
        
        .grid-balance { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .balance-item { background: #f8f9fc; padding: 15px; border-radius: 15px; border-left: 4px solid var(--primary); }
        .balance-item h4 { margin: 0; font-size: 11px; color: #858796; }
        .balance-item p { margin: 5px 0 0; font-size: 15px; font-weight: 700; }

        .filter-section { display: flex; align-items: center; gap: 10px; margin-bottom: 15px; }
        .history-list { max-height: 300px; overflow-y: auto; }
        .history-card { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 12px; border-bottom: 1px solid #f1f1f1; font-size: 14px;
        }
        .history-card .info b { display: block; font-size: 14px; }
        .history-card .info small { color: #aaa; font-size: 11px; }
        .history-card .amt { color: var(--danger); font-weight: 700; }

        /* Mencegah zoom saat input di iPhone */
        @media screen and (max-width: 768px) { input, select { font-size: 16px; } }
    </style>
</head>
<body>

<div class="app-container">
    <h2>Dompetku 🚀</h2>
    <p style="margin-top:0; font-size: 13px; color:#888;">Manajemen Keuangan Akumulatif</p>

    <div class="card">
        <label>Input Gaji & Periode</label>
        <div style="display: flex; gap: 5px;">
            <input type="number" id="inputGaji" placeholder="Nominal Gaji">
            <select id="bulanGaji" style="width: 120px;">
                <option value="1">Januari</option><option value="2">Februari</option>
                <option value="3">Maret</option><option value="4">April</option>
                <option value="5">Mei</option><option value="6">Juni</option>
                <option value="7">Juli</option><option value="8">Agustus</option>
                <option value="9">September</option><option value="10">Oktober</option>
                <option value="11">November</option><option value="12">Desember</option>
            </select>
        </div>
        <button class="btn btn-primary" onclick="tambahGaji()">Set & Tambah Saldo</button>
    </div>

    <div class="card">
        <div class="filter-section">
            <label style="margin:0;">Filter Tampilan:</label>
            <select id="filterBulan" onchange="updateTampilan()" style="margin:0; padding: 5px;">
                <option value="all">Semua (Akumulasi)</option>
                <option value="1">Januari</option><option value="2">Februari</option>
                <option value="3">Maret</option><option value="4">April</option>
                <option value="5">Mei</option><option value="6">Juni</option>
                <option value="7">Juli</option><option value="8">Agustus</option>
                <option value="9">September</option><option value="10">Oktober</option>
                <option value="11">November</option><option value="12">Desember</option>
            </select>
        </div>
        <div class="grid-balance">
            <div class="balance-item" style="border-color: #1cc88a;">
                <h4>Kebutuhan</h4><p id="view-kebutuhan">Rp 0</p>
            </div>
            <div class="balance-item" style="border-color: #4e73df;">
                <h4>Tabungan</h4><p id="view-tabungan">Rp 0</p>
            </div>
            <div class="balance-item" style="border-color: #f6c23e;">
                <h4>Keinginan</h4><p id="view-keinginan">Rp 0</p>
            </div>
            <div class="balance-item" style="border-color: #e74a3b;">
                <h4>Darurat</h4><p id="view-darurat">Rp 0</p>
            </div>
        </div>
    </div>

    <div class="card">
        <label>Catat Pengeluaran Baru</label>
        <select id="katKeluar">
            <option value="kebutuhan">Kebutuhan (50%)</option>
            <option value="tabungan">Tabungan (20%)</option>
            <option value="keinginan">Keinginan (20%)</option>
            <option value="darurat">Darurat (10%)</option>
        </select>
        <input type="text" id="ketKeluar" placeholder="Keterangan (Contoh: Beli Makan)">
        <input type="number" id="nomKeluar" placeholder="Nominal Rp">
        <button class="btn btn-success" onclick="catatTransaksi()">Simpan Transaksi</button>
    </div>

    <div class="card">
        <label>Riwayat Transaksi</label>
        <div id="listRiwayat" class="history-list"></div>
    </div>

    <button onclick="hapusSemua()" style="background:none; border:none; color:#ccc; font-size: 10px; width: 100%; margin-bottom: 50px;">Reset Semua Data</button>
</div>

<script>
    // Database di LocalStorage
    let db = JSON.parse(localStorage.getItem('db_keuangan')) || {
        saldo: { kebutuhan: 0, tabungan: 0, keinginan: 0, darurat: 0 },
        transaksi: [] // { tipe: 'gaji'/'keluar', bulan: 3, kat: 'kebutuhan', ket: '..', amt: 1000 }
    };

    function formatRupiah(n) { return "Rp " + Math.round(n).toLocaleString('id-ID'); }

    function simpan() { localStorage.setItem('db_keuangan', JSON.stringify(db)); }

    function tambahGaji() {
        const amt = parseFloat(document.getElementById('inputGaji').value);
        const bln = document.getElementById('bulanGaji').value;
        if(!amt) return alert("Isi nominal gaji!");

        // Alokasi
        db.saldo.kebutuhan += amt * 0.5;
        db.saldo.tabungan += amt * 0.2;
        db.saldo.keinginan += amt * 0.2;
        db.saldo.darurat += amt * 0.1;

        // Catat di transaksi
        db.transaksi.unshift({ tipe: 'gaji', bulan: bln, amt: amt, ket: 'Masuk Gaji' });

        // Reset Input
        document.getElementById('inputGaji').value = "";
        simpan(); updateTampilan();
        alert("Gaji bulan ini berhasil ditambahkan!");
    }

    function catatTransaksi() {
        const kat = document.getElementById('katKeluar').value;
        const ket = document.getElementById('ketKeluar').value;
        const nom = parseFloat(document.getElementById('nomKeluar').value);
        const bln = new Date().getMonth() + 1; // Otomatis bulan sekarang

        if(!ket || !nom) return alert("Keterangan dan nominal harus diisi!");
        if(nom > db.saldo[kat]) return alert("Saldo " + kat + " tidak cukup!");

        db.saldo[kat] -= nom;
        db.transaksi.unshift({ tipe: 'keluar', bulan: bln.toString(), kat: kat, ket: ket, amt: nom });

        document.getElementById('ketKeluar').value = "";
        document.getElementById('nomKeluar').value = "";
        simpan(); updateTampilan();
    }

    function updateTampilan() {
        const filter = document.getElementById('filterBulan').value;
        let sKebutuhan = 0, sTabungan = 0, sKeinginan = 0, sDarurat = 0;

        if (filter === 'all') {
            sKebutuhan = db.saldo.kebutuhan;
            sTabungan = db.saldo.tabungan;
            sKeinginan = db.saldo.keinginan;
            sDarurat = db.saldo.darurat;
        } else {
            // Logika filter: Hitung saldo khusus bulan tersebut (Gaji bulan itu - pengeluaran bulan itu)
            db.transaksi.forEach(t => {
                if(t.bulan === filter) {
                    if(t.tipe === 'gaji') {
                        sKebutuhan += t.amt * 0.5; sTabungan += t.amt * 0.2;
                        sKeinginan += t.amt * 0.2; sDarurat += t.amt * 0.1;
                    } else {
                        if(t.kat === 'kebutuhan') sKebutuhan -= t.amt;
                        if(t.kat === 'tabungan') sTabungan -= t.amt;
                        if(t.kat === 'keinginan') sKeinginan -= t.amt;
                        if(t.kat === 'darurat') sDarurat -= t.amt;
                    }
                }
            });
        }

        document.getElementById('view-kebutuhan').innerText = formatRupiah(sKebutuhan);
        document.getElementById('view-tabungan').innerText = formatRupiah(sTabungan);
        document.getElementById('view-keinginan').innerText = formatRupiah(sKeinginan);
        document.getElementById('view-darurat').innerText = formatRupiah(sDarurat);

        // Render Riwayat
        const list = document.getElementById('listRiwayat');
        list.innerHTML = "";
        db.transaksi.forEach(t => {
            if(filter === 'all' || t.bulan === filter) {
                const item = document.createElement('div');
                item.className = 'history-card';
                const warna = t.tipe === 'gaji' ? 'style="color:green"' : '';
                item.innerHTML = `
                    <div class="info">
                        <b>${t.ket}</b>
                        <small>${t.tipe === 'gaji' ? 'Pemasukan' : t.kat.toUpperCase()}</small>
                    </div>
                    <div class="amt" ${warna}>${t.tipe === 'gaji' ? '+' : '-'}${formatRupiah(t.amt)}</div>
                `;
                list.appendChild(item);
            }
        });
    }

    function hapusSemua() {
        if(confirm("Hapus semua data?")) { localStorage.clear(); location.reload(); }
    }

    // Set bulan default ke bulan sekarang
    document.getElementById('bulanGaji').value = new Date().getMonth() + 1;
    updateTampilan();
</script>

</body>
</html>
