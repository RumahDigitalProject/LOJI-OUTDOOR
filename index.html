<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Spin THR Kasino</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<audio id="tickSound"
src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

<style>

body{
margin:0;
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
overflow:hidden;
}

.app{
max-width:420px;
width:100%;
text-align:center;
}

input{
padding:12px;
width:80%;
font-size:18px;
border:none;
border-radius:8px;
text-align:center;
margin-bottom:15px;
}

/* POINTER */
.pointer{
width:0;
height:0;
border-left:22px solid transparent;
border-right:22px solid transparent;
border-top:45px solid gold;
margin:auto;
transition:.08s;
}

.pointer.hit{
transform:rotate(-12deg);
}

/* 3D WHEEL */
.wheel3d{
perspective:900px;
}

canvas{
border-radius:50%;
border:10px solid white;
box-shadow:
0 25px 40px rgba(0,0,0,.7),
inset 0 10px 20px rgba(255,255,255,.3),
inset 0 -20px 40px rgba(0,0,0,.6);
}

button{
margin-top:20px;
padding:14px 40px;
font-size:22px;
background:gold;
border:none;
border-radius:12px;
cursor:pointer;
}

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
visibility:hidden;
transition:.4s;
}

.popup.show{
opacity:1;
visibility:visible;
}

.card{
background:linear-gradient(135deg,#fde047,#f59e0b);
color:black;
padding:35px;
border-radius:20px;
animation:pop .4s ease;
}

@keyframes pop{
from{transform:scale(.5)}
to{transform:scale(1)}
}

</style>
</head>

<body>

<div class="app">

<h2>🎰 SPIN THR 🎰</h2>

<input id="playerName" placeholder="Masukkan Nama">

<div class="pointer"></div>

<div class="wheel3d">
<canvas id="wheel" width="320" height="320"></canvas>
</div>

<button onclick="spin()">SPIN</button>

</div>

<div id="popup" class="popup">
<div class="card">
<h2 id="winner"></h2>
<h1 id="amount"></h1>
<button id="actionBtn">CLAIM</button>
</div>
</div>

<script>

/* ========= ADMIN ========= */

const playerRewards={
"siti":{hadiah:50000,mode:"zonkFirst"},
"andi":{hadiah:100000,mode:"direct"}
};

const rewards=[10000,25000,50000,75000,100000,0,25000,0];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

let spinning=false;
let rotation=0;
let playerTurn={};

const center=160;
const radius=160;

/* DRAW */
function draw(){
const arc=(Math.PI*2)/rewards.length;

for(let i=0;i<rewards.length;i++){

ctx.beginPath();
ctx.fillStyle=
["#ef4444","#22c55e","#3b82f6",
"#f59e0b","#a855f7","#111827",
"#14b8a6","#111827"][i];

ctx.moveTo(center,center);
ctx.arc(center,center,radius,i*arc,(i+1)*arc);
ctx.fill();

ctx.save();
ctx.translate(center,center);
ctx.rotate(i*arc+arc/2);

ctx.fillStyle="white";
ctx.font="bold 16px Arial";

ctx.fillText(
rewards[i]==0?"ZONK":
"Rp"+rewards[i].toLocaleString(),
70,5);

ctx.restore();
}
}
draw();

/* CLICK EFFECT */
let lastSlice=0;

function playTick(){
const sound=document.getElementById("tickSound");
sound.currentTime=0;
sound.play();

const p=document.querySelector(".pointer");
p.classList.add("hit");
setTimeout(()=>p.classList.remove("hit"),70);
}

/* ===== SPIN ===== */

function spin(){

if(spinning)return;

let name=document
.getElementById("playerName")
.value.toLowerCase().trim();

if(!name)return alert("Isi nama");

if(!playerTurn[name])playerTurn[name]=1;

spinning=true;

let hadiah;

if(playerRewards[name]){
let data=playerRewards[name];
hadiah=
(data.mode==="zonkFirst" &&
playerTurn[name]===1)
?0:data.hadiah;
}else{
hadiah=rewards[Math.floor(Math.random()*rewards.length)];
}

let index=rewards.indexOf(hadiah);
const slice=360/rewards.length;

const target=
270-(index*slice)-(slice/2);

let spins=8+Math.random()*3;

let startRot=rotation;
let endRot=rotation+(spins*360)+target;

let duration=6000;
let start=null;

function animate(t){

if(!start)start=t;

let progress=(t-start)/duration;
if(progress>1)progress=1;

let ease=1-Math.pow(1-progress,3);

let current=
startRot+(endRot-startRot)*ease;

/* near stop drama */
if(progress>0.92){
current+=Math.sin(progress*80)*0.5;
}

canvas.style.transform=
`rotateX(25deg) rotate(${current}deg)`;

/* tick */
let sliceDeg=360/rewards.length;
let passed=Math.floor(current/sliceDeg);

if(passed!=lastSlice){
playTick();
lastSlice=passed;
}

if(progress<1){
requestAnimationFrame(animate);
}else{

rotation=endRot;

playerTurn[name]++;

showPopup(name,hadiah);

if(hadiah!==0)
confetti({particleCount:350,spread:150});

spinning=false;
}
}

requestAnimationFrame(animate);
}

/* POPUP */

function showPopup(name,amount){

document.getElementById("winner")
.innerText=name.toUpperCase();

const btn=document.getElementById("actionBtn");

if(amount===0 &&
playerRewards[name] &&
playerRewards[name].mode==="zonkFirst"){

document.getElementById("amount").innerText="😢 ZONK";

btn.innerText="ULANG";
btn.onclick=()=>{
popup.classList.remove("show");
spin();
};

}else{

document.getElementById("amount")
.innerText=
amount==0?"😢 ZONK":
"Rp "+amount.toLocaleString();

btn.innerText="CLAIM";
btn.onclick=()=>{
popup.classList.remove("show");
playerName.value="";
};
}

popup.classList.add("show");
}

</script>

</body>
</html>
