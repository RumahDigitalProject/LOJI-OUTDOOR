<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dompetku Cloud Ultimate</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1; --success: #10b981; --danger: #f43f5e; --warning: #f59e0b;
            --bg: #f8fafc; --card: #ffffff; --text: #1e293b;
        }
        @media (prefers-color-scheme: dark) {
            :root { --bg: #0f172a; --card: #1e293b; --text: #f1f5f9; }
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; -webkit-tap-highlight-color: transparent; }
        body { background: var(--bg); color: var(--text); padding: 15px; padding-bottom: 60px; }
        .container { max-width: 480px; margin: auto; }
        
        header { margin-bottom: 25px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 26px; font-weight: 800; color: var(--primary); letter-spacing: -1px; }
        .status-cloud { font-size: 10px; font-weight: 700; padding: 4px 10px; border-radius: 20px; background: #e2e8f0; color: #64748b; margin-top: 4px; display: inline-block; }
        .online { background: #dcfce7; color: #15803d; }

        .card { background: var(--card); border-radius: 24px; padding: 20px; margin-bottom: 15px; box-shadow: 0 4px 20px rgba(0,0,0,0.05); }
        .label { font-size: 11px; font-weight: 800; opacity: 0.5; text-transform: uppercase; margin-bottom: 10px; display: block; }
        
        /* Dashboard & Progress Bars */
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .b-item { padding: 16px; border-radius: 20px; background: rgba(99, 102, 241, 0.04); border: 1px solid rgba(0,0,0,0.02); }
        .b-item p { font-size: 16px; font-weight: 800; margin: 4px 0; }
        .progress-container { width: 100%; height: 6px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-top: 8px; }
        .progress-fill { height: 100%; width: 0%; transition: 1s cubic-bezier(0.4, 0, 0.2, 1); }

        input, select { width: 100%; background: var(--bg); border: 2px solid transparent; color: var(--text); padding: 14px; border-radius: 16px; margin-bottom: 12px; font-size: 16px; outline: none; }
        input:focus { border-color: var(--primary); }
        
        .btn { width: 100%; padding: 16px; border-radius: 16px; border: none; font-weight: 700; cursor: pointer; transition: 0.2s; font-size: 15px; }
        .btn:active { transform: scale(0.96); }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 4px 15px rgba(99, 102, 241, 0.3); }
        .btn-success { background: var(--success); color: white; }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); margin-top: 15px; }

        .stats-highlight { background: var(--primary); color: white; padding: 18px; border-radius: 20px; margin-top: 15px; }
        .history-item { display: flex; justify-content: space-between; padding: 16px 0; border-bottom: 1px solid rgba(0,0,0,0.05); }
        .history-item b { font-size: 14px; display: block; }
        .history-item small { opacity: 0.5; font-size: 10px; font-weight: 700; text-transform: uppercase; }
        .amt { text-align: right; font-weight: 800; font-size: 14px; }
    </style>
</head>
<body>

<div class="container">
    <header>
        <div>
            <h1>Dompetku.</h1>
            <div id="status" class="status-cloud">Menunggu Aksi... ☁️</div>
        </div>
        <p id="today" style="font-size: 11px; font-weight: 700; opacity: 0.5; text-align: right;"></p>
    </header>

    <div class="card">
        <span class="label">Saldo Akumulasi Saat Ini</span>
        <div class="balance-grid">
            <div class="b-item"><span>Wajib</span><p id="v-kebutuhan">0</p><div class="progress-container"><div id="p-kebutuhan" class="progress-fill" style="background:var(--success)"></div></div></div>
            <div class="b-item"><span>Tabung</span><p id="v-tabungan">0</p><div class="progress-container"><div id="p-tabungan" class="progress-fill" style="background:var(--primary)"></div></div></div>
            <div class="b-item"><span>Main</span><p id="v-keinginan">0</p><div class="progress-container"><div id="p-keinginan" class="progress-fill" style="background:var(--warning)"></div></div></div>
            <div class="b-item"><span>Darurat</span><p id="v-darurat">0</p><div class="progress-container"><div id="p-darurat" class="progress-fill" style="background:var(--danger)"></div></div></div>
        </div>
    </div>

    <div class="card">
        <span class="label">Input Gaji & Alokasi</span>
        <div style="display: flex; gap: 8px;">
            <input type="number" id="inGaji" placeholder="Nominal Gaji">
            <select id="blnGaji" style="width: 140px;"></select>
        </div>
        <button class="btn btn-primary" onclick="tambahGaji()">Alokasikan & Sinkron Cloud</button>
    </div>

    <div class="card">
        <span class="label">Transaksi Baru</span>
        <select id="katKeluar">
            <option value="kebutuhan">Kebutuhan (50%)</option><option value="tabungan">Tabungan (20%)</option>
            <option value="keinginan">Keinginan (20%)</option><option value="darurat">Darurat (10%)</option>
        </select>
        <input type="text" id="ketKeluar" list="hintList" placeholder="Keterangan (misal: Lauk)">
        <datalist id="hintList"></datalist>
        <input type="number" id="nomKeluar" placeholder="Nominal Rp">
        <button class="btn btn-success" onclick="catat()">Simpan & Kirim Cloud</button>
    </div>

    <div class="card">
        <span class="label">Riwayat & Filter Detil</span>
        <div style="display: flex; gap: 8px; margin-bottom: 10px;">
            <select id="fBulan" onchange="update()"></select>
            <input type="text" id="fKeyword" onkeyup="update()" placeholder="Cari keterangan..." style="margin-bottom:0;">
        </div>
        
        <div id="statsBox" class="stats-highlight" style="display:none;">
            <small style="font-weight:700; opacity:0.8;">Total Terfilter:</small>
            <h2 id="totalFiltered" style="font-size: 26px;">Rp 0</h2>
        </div>

        <button class="btn btn-outline" onclick="unduhLaporan()">📥 Unduh Laporan Terfilter (.csv)</button>
        <div id="logList" style="margin-top:20px;"></div>
    </div>

    <button onclick="hapusSemua()" style="background:none; border:none; color:var(--danger); font-size: 11px; width: 100%; font-weight: 800; margin-top: 30px; opacity: 0.4;">RESET SEMUA DATA</button>
</div>

<script>
    const URL_CLOUD = "https://script.google.com/macros/s/AKfycbxVDw1tDrqVeVsuwMGTUtuuSSfU9uBdHCXK4cfgwGLoTcMbio0LuXo0sWLiS83GveSc/exec";

    let db = JSON.parse(localStorage.getItem('dompet_cloud_ultra')) || {
        saldo: { kebutuhan: 0, tabungan: 0, keinginan: 0, darurat: 0 },
        initial: { kebutuhan: 0, tabungan: 0, keinginan: 0, darurat: 0 },
        logs: [], hints: []
    };

    const fmt = (n) => "Rp " + Math.round(n).toLocaleString('id-ID');

    async function kirimCloud(payload) {
        document.getElementById('status').innerText = "☁️ Sinkronisasi...";
        document.getElementById('status').classList.remove('online');
        try {
            await fetch(URL_CLOUD, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            document.getElementById('status').innerText = "✅ Cloud Tersinkron";
            document.getElementById('status').classList.add('online');
        } catch (e) { document.getElementById('status').innerText = "❌ Gagal Sinkron"; }
    }

    function update() {
        document.getElementById('v-kebutuhan').innerText = fmt(db.saldo.kebutuhan);
        document.getElementById('v-tabungan').innerText = fmt(db.saldo.tabungan);
        document.getElementById('v-keinginan').innerText = fmt(db.saldo.keinginan);
        document.getElementById('v-darurat').innerText = fmt(db.saldo.darurat);

        ['kebutuhan','tabungan','keinginan','darurat'].forEach(id => {
            const perc = db.initial[id] > 0 ? (db.saldo[id] / db.initial[id]) * 100 : 0;
            document.getElementById('p-'+id).style.width = Math.min(Math.max(perc, 0), 100) + "%";
        });

        const fMonth = document.getElementById('fBulan').value;
        const fKey = document.getElementById('fKeyword').value.toLowerCase();
        const logList = document.getElementById('logList');
        let totalF = 0;

        logList.innerHTML = "";
        db.logs.forEach(l => {
            if((fMonth === 'all' || l.month === fMonth) && l.ket.toLowerCase().includes(fKey)) {
                if(l.type === 'OUT') totalF += l.amt;
                logList.innerHTML += `
                    <div class="history-item">
                        <div><b>${l.ket}</b><small>${l.date} | ${l.kat}</small></div>
                        <div class="amt" style="color:${l.type==='IN'?'var(--success)':'var(--danger)'}">
                            ${l.type==='IN'?'+':'-'}${fmt(l.amt)}
                        </div>
                    </div>`;
            }
        });

        document.getElementById('statsBox').style.display = (fKey || fMonth !== 'all') ? "block" : "none";
        document.getElementById('totalFiltered').innerText = fmt(totalF);

        const hintList = document.getElementById('hintList');
        hintList.innerHTML = "";
        [...new Set(db.hints)].forEach(h => { hintList.innerHTML += `<option value="${h}">`; });

        localStorage.setItem('dompet_cloud_ultra', JSON.stringify(db));
    }

    function tambahGaji() {
        const amt = parseFloat(document.getElementById('inGaji').value);
        const bln = document.getElementById('blnGaji').value;
        if(!amt) return;
        
        const now = new Date();
        const dateStr = now.toLocaleDateString('id-ID') + " " + now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
        
        const k = amt * 0.5, t = amt * 0.2, m = amt * 0.2, d = amt * 0.1;
        db.saldo.kebutuhan += k; db.saldo.tabungan += t; db.saldo.keinginan += m; db.saldo.darurat += d;
        db.initial.kebutuhan += k; db.initial.tabungan += t; db.initial.keinginan += m; db.initial.darurat += d;

        const payload = { date: dateStr, kat: 'PEMASUKAN', ket: 'Gaji Masuk', type: 'IN', amt: amt, month: bln };
        db.logs.unshift(payload);
        kirimCloud(payload);
        document.getElementById('inGaji').value = "";
        update();
    }

    function catat() {
        const kat = document.getElementById('katKeluar').value;
        const ket = document.getElementById('ketKeluar').value;
        const nom = parseFloat(document.getElementById('nomKeluar').value);
        const bln = document.getElementById('blnGaji').value; 

        if(!ket || !nom) return alert("Isi keterangan & nominal!");
        if(nom > db.saldo[kat]) return alert("Saldo tidak cukup!");

        const now = new Date();
        const dateStr = now.toLocaleDateString('id-ID') + " " + now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});

        db.saldo[kat] -= nom;
        const payload = { date: dateStr, kat: kat, ket: ket, type: 'OUT', amt: nom, month: bln };
        db.logs.unshift(payload);
        if(!db.hints.includes(ket)) db.hints.push(ket);
        kirimCloud(payload);
        document.getElementById('ketKeluar').value = "";
        document.getElementById('nomKeluar').value = "";
        update();
    }

    function unduhLaporan() {
        let csv = "Tanggal,Kategori,Keterangan,Tipe,Nominal\n";
        db.logs.forEach(l => { csv += `${l.date},${l.kat},${l.ket},${l.type},${l.amt}\n`; });
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Laporan_Dompetku_Cloud.csv`;
        link.click();
    }

    function hapusSemua() { if(confirm("Hapus semua data permanen?")) { localStorage.clear(); location.reload(); } }

    // Init Dropdowns
    const months = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    const blnGaji = document.getElementById('blnGaji');
    const fBulan = document.getElementById('fBulan');
    fBulan.innerHTML = `<option value="all">Semua Bulan</option>`;
    months.forEach((m, i) => {
        const opt = `<option value="${i+1}">${m}</option>`;
        blnGaji.innerHTML += opt;
        fBulan.innerHTML += opt;
    });

    document.getElementById('today').innerText = new Intl.DateTimeFormat('id-ID', { dateStyle: 'full' }).format(new Date());
    document.getElementById('blnGaji').value = new Date().getMonth() + 1;
    update();
</script>
</body>
</html>
