<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Spin THR</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>
body{
margin:0;
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
overflow:hidden;
}

.app{
max-width:420px;
width:100%;
text-align:center;
}

input{
padding:8px;
width:60%;
font-size:14px;
border:none;
border-radius:8px;
text-align:center;
margin-bottom:50px;
}

.pointer{
width:0;
height:0;
border-left:19px solid transparent;
border-right:19px solid transparent;
border-top:45px solid gold;
margin:auto;
}

canvas{
border-radius:50%;
border:10px solid white;
}

button{
margin-top:20px;
padding:14px 40px;
font-size:22px;
background:gold;
border:none;
border-radius:12px;
cursor:pointer;
}

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
visibility:hidden;
transition:.4s;
}

.popup.show{
opacity:1;
visibility:visible;
}

.card{
background:linear-gradient(135deg,#fde047,#f59e0b);
color:black;
padding:35px;
border-radius:20px;
animation:pop .4s ease;
}

@keyframes pop{
from{transform:scale(.5)}
to{transform:scale(1)}
}
</style>
</head>

<body>

<div class="app">

<h2>THR 2026</h2>

<input id="playerName" placeholder="Masukkan Nama">

<div class="pointer"></div>

<canvas id="wheel" width="320" height="320"></canvas>

<button onclick="spin()">SPIN</button>

</div>

<!-- RESULT POPUP -->
<div id="popup" class="popup">
<div class="card">
<h2 id="winner"></h2>
<h1 id="amount"></h1>
<button id="actionBtn" onclick="claimReward()">CLAIM</button>
</div>
</div>

<!-- ✅ ADMIN PANEL -->
<div id="adminPanel" class="popup">
<div class="card" style="max-height:80vh;overflow:auto">
<h2>ADMIN PANEL</h2>
<div id="adminList"></div>
<br>
<button onclick="addRow()">+ Tambah Nama</button>
<button onclick="saveAdmin()">💾 Simpan</button>
</div>
</div>

<script>

/* ========= DATA ADMIN (AUTO SAVE) ========= */

let playerRewards =
JSON.parse(localStorage.getItem("thrData")) || {};

/* roda */
const rewards=[
10000,20000,50000,0,100000,200000,500000,0
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

let spinning=false;
let visualRotation=0;
let playerTurn={};

const center=160;
const radius=160;

/* DRAW */
function draw(){

const arc=(Math.PI*2)/rewards.length;

const colors=[
"#ef4444","#22c55e","#3b82f6",
"#f59e0b","#a855f7","#111827",
"#14b8a6","#111827"
];

for(let i=0;i<rewards.length;i++){

ctx.beginPath();
ctx.fillStyle=colors[i];

ctx.moveTo(center,center);
ctx.arc(center,center,radius,i*arc,(i+1)*arc);
ctx.fill();

ctx.save();
ctx.translate(center,center);
ctx.rotate(i*arc+arc/2);

ctx.fillStyle="white";
ctx.font="bold 16px Arial";

ctx.fillText(
rewards[i]==0?"ZONK":
"Rp"+rewards[i].toLocaleString(),
70,5);

ctx.restore();
}
}
draw();

/* ========= ADMIN ========= */

function openAdmin(){
document.getElementById("adminPanel").classList.add("show");
renderAdmin();
}

function closeAdmin(){
document.getElementById("adminPanel").classList.remove("show");
}

function renderAdmin(){

let wrap=document.getElementById("adminList");
wrap.innerHTML="";

Object.keys(playerRewards).forEach(name=>{

wrap.innerHTML+=`
<div style="margin:8px 0">
<input class="name" value="${name}">
<select class="mode">
<option value="direct"
${playerRewards[name].mode=="direct"?"selected":""}>
Langsung Menang
</option>
<option value="zonkFirst"
${playerRewards[name].mode=="zonkFirst"?"selected":""}>
Zonk Dulu
</option>
</select>
<input type="number"
class="hadiah"
value="${playerRewards[name].hadiah}"
placeholder="Hadiah">
</div>`;
});
}

function addRow(){
document.getElementById("adminList")
.innerHTML+=`
<div>
<input class="name" placeholder="Nama">
<select class="mode">
<option value="direct">Langsung</option>
<option value="zonkFirst">Zonk dulu</option>
</select>
<input type="number"
class="hadiah"
placeholder="Hadiah">
</div>`;
}

function saveAdmin(){

playerRewards={};

document
.querySelectorAll("#adminList div")
.forEach(row=>{

let name=row.querySelector(".name")
.value.trim().toLowerCase();

let mode=row.querySelector(".mode").value;

let hadiah=parseInt(
row.querySelector(".hadiah").value);

if(name){
playerRewards[name]={mode,hadiah};
}

});

localStorage.setItem(
"thrData",
JSON.stringify(playerRewards)
);

closeAdmin();
alert("Data tersimpan ✅");
}

/* ===== SPIN ===== */

function spin(){

if(spinning)return;

let name=document
.getElementById("playerName")
.value.trim().toLowerCase();

if(!name){
alert("Masukkan nama dulu");
return;
}

/* LOGIN ADMIN */
if(name==="admin"){
openAdmin();
return;
}

if(!playerTurn[name])playerTurn[name]=1;

spinning=true;

let hadiah;

if(playerRewards[name]){

let data=playerRewards[name];

if(data.mode==="zonkFirst"
&& playerTurn[name]===1){
hadiah=0;
}else{
hadiah=data.hadiah;
}

}else{

hadiah=
rewards[Math.floor(
Math.random()*rewards.length)];
}

let index=rewards.indexOf(hadiah);

const slice=360/rewards.length;

const targetAngle=
270-(index*slice)-(slice/2);

canvas.style.transition="none";
canvas.style.transform=
`rotate(${visualRotation%360}deg)`;

canvas.offsetHeight;

let spins=7+Math.floor(Math.random()*3);

let current=visualRotation%360;

let correction=
(targetAngle-current+360)%360;

visualRotation+=(spins*360)+correction;

canvas.style.transition=
"transform 6s cubic-bezier(0.12,0.95,0.18,1)";

canvas.style.transform=
`rotate(${visualRotation}deg)`;

setTimeout(()=>{

playerTurn[name]++;

showPopup(name,hadiah);

if(hadiah!==0){
confetti({particleCount:300,spread:140});
}

spinning=false;

},6000);
}

/* POPUP */

function showPopup(name,amount){

document.getElementById("winner")
.innerText=name.toUpperCase();

const btn=document.getElementById("actionBtn");

if(amount===0 &&
playerRewards[name] &&
playerRewards[name].mode==="zonkFirst"){

document.getElementById("amount")
.innerText="😢 ZONK";

btn.innerText="ULANG";
btn.onclick=retrySpin;

}else{

document.getElementById("amount")
.innerText=
amount==0?"😢 ZONK":
"Rp "+amount.toLocaleString();

btn.innerText="CLAIM";
btn.onclick=claimReward;
}

document.getElementById("popup")
.classList.add("show");
}

function retrySpin(){
document.getElementById("popup")
.classList.remove("show");
spin();
}

function claimReward(){
document.getElementById("popup")
.classList.remove("show");
document.getElementById("playerName").value="";
}

</script>

</body>
</html>
