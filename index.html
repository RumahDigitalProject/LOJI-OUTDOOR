<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Spin THR</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

body{
margin:0;
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
overflow:hidden;
}

.app{
max-width:420px;
width:100%;
text-align:center;
}

input{
padding:12px;
width:80%;
font-size:18px;
border:none;
border-radius:8px;
text-align:center;
margin-bottom:15px;
}

/* PANAH KE BAWAH */
.pointer{
width:0;
height:0;
border-left:22px solid transparent;
border-right:22px solid transparent;
border-top:45px solid gold;
margin:auto;
}

/* RODA */
canvas{
border-radius:50%;
border:10px solid white;
transition:transform 5s cubic-bezier(.12,.8,.25,1);
}

button{
margin-top:20px;
padding:14px 40px;
font-size:22px;
background:gold;
border:none;
border-radius:12px;
cursor:pointer;
}

/* POPUP */
.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
visibility:hidden;
transition:.4s;
}

.popup.show{
opacity:1;
visibility:visible;
}

.card{
background:linear-gradient(135deg,#fde047,#f59e0b);
color:black;
padding:35px;
border-radius:20px;
text-align:center;
animation:pop .4s ease;
}

@keyframes pop{
from{transform:scale(.5)}
to{transform:scale(1)}
}

</style>
</head>

<body>

<div class="app">

<h2>🎁 SPIN THR 🎁</h2>

<input id="playerName"
placeholder="Masukkan Nama">

<div class="pointer"></div>

<canvas id="wheel" width="320" height="320"></canvas>

<button onclick="spin()">SPIN</button>

</div>

<div id="popup" class="popup">
<div class="card">
<h2 id="winner"></h2>
<h1 id="amount"></h1>
<button onclick="claimReward()">CLAIM</button>
</div>
</div>

<script>

/* ========= ADMIN SETTING ========= */

const playerRewards={
"siti":50000,
"andi":100000,
"budi":25000,
"rina":75000
};

const rewards=[
10000,
25000,
50000,
75000,
100000
];

/* ================================= */

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

const center=160;
const radius=160;

let spinning=false;

/* DRAW */
function draw(){

const arc=(Math.PI*2)/rewards.length;

const colors=[
"#ef4444",
"#22c55e",
"#3b82f6",
"#f59e0b",
"#a855f7"
];

for(let i=0;i<rewards.length;i++){

ctx.beginPath();
ctx.fillStyle=colors[i];

ctx.moveTo(center,center);
ctx.arc(center,center,radius,
i*arc,(i+1)*arc);

ctx.fill();

ctx.save();
ctx.translate(center,center);
ctx.rotate(i*arc+arc/2);

ctx.fillStyle="white";
ctx.font="bold 16px Arial";
ctx.fillText(
"Rp"+rewards[i].toLocaleString(),
70,5);

ctx.restore();
}
}

draw();

/* ===== SPIN AKURAT ===== */
let visualRotation=0;

function spin(){

if(spinning)return;

let name=document
.getElementById("playerName")
.value.trim().toLowerCase();

if(!name){
alert("Masukkan nama dulu");
return;
}

spinning=true;

/* =========================
CEK ADMIN ATAU RANDOM
========================= */

let hadiah;

if(playerRewards[name]){
hadiah=playerRewards[name];
}else{
hadiah=
rewards[
Math.floor(Math.random()*rewards.length)
];
}

/* ========================= */

let index=rewards.indexOf(hadiah);

const slice=360/rewards.length;

const targetAngle=
270-(index*slice)-(slice/2);

/* reset visual */
canvas.style.transition="none";
canvas.style.transform=
`rotate(${visualRotation%360}deg)`;

canvas.offsetHeight;

/* spin natural */
let spins=
7+Math.floor(Math.random()*3);

let current=
visualRotation%360;

let correction=
(targetAngle-current+360)%360;

visualRotation+=
(spins*360)+correction;

canvas.style.transition=
"transform 6s cubic-bezier(0.12,0.95,0.18,1)";

canvas.style.transform=
`rotate(${visualRotation}deg)`;

/* RESULT */
setTimeout(()=>{

showPopup(name,hadiah);

confetti({
particleCount:250,
spread:120
});

spinning=false;

},6000);
}
/* POPUP */

function showPopup(name,amount){

document.getElementById("winner")
.innerText=name.toUpperCase();

document.getElementById("amount")
.innerText=
"Rp "+amount.toLocaleString();

document.getElementById("popup")
.classList.add("show");
}
function claimReward(){

document.getElementById("popup")
.classList.remove("show");

/* kosongkan nama */
document.getElementById("playerName").value="";

}

</script>

</body>
</html>
