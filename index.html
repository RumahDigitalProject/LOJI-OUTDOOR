<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Spin THR</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

body{
margin:0;
background:#0f172a;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.app{
width:100%;
max-width:420px;
text-align:center;
}

/* POINTER */
.pointer{
width:0;
height:0;
border-left:20px solid transparent;
border-right:20px solid transparent;
border-bottom:40px solid gold;
margin:auto;
z-index:10;
}

/* WHEEL */
canvas{
margin-top:-5px;
border-radius:50%;
border:10px solid white;
transition:transform 5s cubic-bezier(.15,.8,.25,1);
}

button{
margin-top:25px;
padding:15px 40px;
font-size:22px;
background:gold;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:26px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="app">

<h2>🎁 SPIN THR 🎁</h2>

<div class="pointer"></div>

<canvas id="wheel"
width="320"
height="320"></canvas>

<button onclick="spin()">SPIN</button>

<div id="result"
class="result"></div>

</div>

<audio id="sound"
src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

<script>

/* NOMINAL THR */
const rewards=[
10000,
20000,
50000,
100000,
25000,
75000
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

const center=160;
const radius=160;

let currentRotation=0;
let spinning=false;

/* DRAW WHEEL */
function drawWheel(){

const arc=(Math.PI*2)/rewards.length;

const colors=[
"#ef4444",
"#22c55e",
"#3b82f6",
"#f59e0b",
"#a855f7",
"#06b6d4"
];

for(let i=0;i<rewards.length;i++){

ctx.beginPath();
ctx.fillStyle=colors[i%colors.length];

ctx.moveTo(center,center);

ctx.arc(
center,
center,
radius,
i*arc,
(i+1)*arc
);

ctx.fill();

ctx.save();
ctx.translate(center,center);
ctx.rotate(i*arc+arc/2);

ctx.fillStyle="white";
ctx.font="bold 16px Arial";
ctx.fillText(
"Rp"+rewards[i].toLocaleString(),
70,5
);

ctx.restore();
}
}

drawWheel();

/* SPIN FIX AKURAT */
function spin(){

if(spinning)return;
spinning=true;

document.getElementById("sound").play();

const slice=360/rewards.length;

/* pilih hadiah dulu */
const index=
Math.floor(Math.random()*rewards.length);

/* hitung posisi berhenti tepat di pointer */
const stopAngle=
360-(index*slice)-(slice/2);

/* tambah putaran */
const extraSpin=360*5;

const finalRotation=
extraSpin+stopAngle;

currentRotation+=finalRotation;

canvas.style.transform=
`rotate(${currentRotation}deg)`;

setTimeout(()=>{

let hadiah=rewards[index];

document.getElementById("result")
.innerHTML=
"🎉 Rp "+
hadiah.toLocaleString();

confetti({
particleCount:180,
spread:100
});

spinning=false;

},5000);

}

</script>

</body>
</html>
