<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport"
content="width=device-width, initial-scale=1.0, maximum-scale=1">

<title>Spin THR</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

body{
margin:0;
background:#111;
font-family:Arial;
color:white;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
height:100vh;
overflow:hidden;
}

/* FULLSCREEN HP */
.app{
width:100%;
max-width:420px;
height:100vh;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

.pointer{
width:0;
height:0;
border-left:18px solid transparent;
border-right:18px solid transparent;
border-bottom:35px solid gold;
z-index:2;
}

canvas{
border-radius:50%;
border:8px solid white;
transition:transform 5s cubic-bezier(.17,.67,.2,1);
}

button{
margin-top:20px;
padding:14px 35px;
font-size:20px;
border:none;
border-radius:12px;
background:gold;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:15px;
font-size:22px;
font-weight:bold;
}

/* ADMIN PANEL */
.admin{
position:fixed;
bottom:0;
background:#222;
width:100%;
max-width:420px;
padding:10px;
}

input{
padding:8px;
width:60%;
border:none;
border-radius:6px;
}

.smallbtn{
padding:8px;
margin-left:5px;
}

</style>
</head>

<body>

<div class="app">

<h2>🎁 SPIN THR 🎁</h2>

<div class="pointer"></div>
<canvas id="wheel"
width="320"
height="320"></canvas>

<button onclick="spin()">SPIN</button>

<div id="result"
class="result"></div>

</div>

<!-- ADMIN -->
<div class="admin">
<input id="nominal"
placeholder="Tambah Nominal">
<button class="smallbtn"
onclick="addNominal()">Tambah</button>
</div>

<audio id="spinSound"
src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

<script>

let rewards =
JSON.parse(localStorage.getItem("thr")) ||
[
"10000",
"20000",
"50000",
"100000"
];

const canvas =
document.getElementById("wheel");
const ctx =
canvas.getContext("2d");

let angle=0;

function save(){
localStorage.setItem(
"thr",
JSON.stringify(rewards)
);
}

function draw(){

ctx.clearRect(0,0,320,320);

const arc =
Math.PI*2/rewards.length;

const colors=[
"#ff4757",
"#1e90ff",
"#2ed573",
"#ffa502",
"#e84393",
"#00cec9",
"#ff6b81"
];

for(let i=0;i<rewards.length;i++){

ctx.beginPath();
ctx.fillStyle=
colors[i%colors.length];

ctx.moveTo(160,160);

ctx.arc(
160,160,
160,
i*arc,
(i+1)*arc
);

ctx.fill();

ctx.save();

ctx.translate(160,160);
ctx.rotate(i*arc+arc/2);

ctx.fillStyle="white";
ctx.font="bold 16px Arial";

ctx.fillText(
"Rp"+rewards[i],
70,5
);

ctx.restore();
}
}

draw();

function spin(){

document.getElementById(
"spinSound").play();

let spinDeg =
Math.floor(Math.random()*360)
+1800;

angle+=spinDeg;

canvas.style.transform=
`rotate(${angle}deg)`;

setTimeout(()=>{

let deg=angle%360;
let slice=360/rewards.length;

let index=
Math.floor(
(360-deg)/slice
)%rewards.length;

let hadiah=
rewards[index];

document.getElementById(
"result"
).innerHTML=
"🎉 Rp"+hadiah;

confetti({
particleCount:150,
spread:90,
origin:{y:0.6}
});

},5000);
}

function addNominal(){

let val=
document.getElementById(
"nominal"
).value;

if(!val)return;

rewards.push(val);

save();
draw();

document.getElementById(
"nominal"
).value="";
}

</script>

</body>
</html>
