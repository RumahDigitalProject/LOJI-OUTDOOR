<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Spin THR</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

body{
margin:0;
background:#0f172a;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
}

.app{
max-width:420px;
width:100%;
text-align:center;
}

input{
padding:12px;
width:80%;
border:none;
border-radius:8px;
font-size:18px;
margin-bottom:15px;
text-align:center;
}

.pointer{
width:0;
height:0;
border-left:20px solid transparent;
border-right:20px solid transparent;
border-bottom:40px solid gold;
margin:auto;
}

canvas{
border-radius:50%;
border:10px solid white;
transition:transform 5s cubic-bezier(.15,.8,.25,1);
}

button{
margin-top:15px;
padding:14px 35px;
font-size:20px;
background:gold;
border:none;
border-radius:10px;
font-weight:bold;
cursor:pointer;
}

.result{
margin-top:20px;
font-size:26px;
font-weight:bold;
}

</style>
</head>

<body>

<div class="app">

<h2>🎁 SPIN THR 🎁</h2>

<input id="playerName"
placeholder="Masukkan Nama Peserta">

<div class="pointer"></div>

<canvas id="wheel"
width="320"
height="320"></canvas>

<button onclick="spin()">SPIN</button>

<div id="result"
class="result"></div>

</div>

<audio id="sound"
src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

<script>

/* ======================
ADMIN SETTING
EDIT DISINI SAJA
====================== */

const playerRewards={
"andi":10000,
"budi":50000,
"siti":100000,
"rina":25000,
"dodi":75000
};

/* NOMINAL DI RODA */
const rewards=[
10000,
25000,
50000,
75000,
100000
];

/* ====================== */

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

const center=160;
const radius=160;

let rotation=0;
let spinning=false;

/* DRAW WHEEL */
function draw(){

const arc=(Math.PI*2)/rewards.length;

const colors=[
"#ef4444",
"#22c55e",
"#3b82f6",
"#f59e0b",
"#a855f7"
];

for(let i=0;i<rewards.length;i++){

ctx.beginPath();
ctx.fillStyle=colors[i];

ctx.moveTo(center,center);
ctx.arc(center,center,radius,
i*arc,(i+1)*arc);
ctx.fill();

ctx.save();
ctx.translate(center,center);
ctx.rotate(i*arc+arc/2);

ctx.fillStyle="white";
ctx.font="bold 16px Arial";
ctx.fillText(
"Rp"+rewards[i].toLocaleString(),
70,5
);

ctx.restore();
}
}

draw();

/* SPIN TERKONTROL */
function spin(){

if(spinning)return;

let name=
document.getElementById(
"playerName"
).value
.toLowerCase()
.trim();

if(!playerRewards[name]){
alert("Nama tidak terdaftar!");
return;
}

spinning=true;

document.getElementById("sound").play();

/* ambil hadiah sesuai setting */
let hadiah=
playerRewards[name];

/* cari posisi nominal */
let index=
rewards.indexOf(hadiah);

const slice=360/rewards.length;

const stopAngle=
360-(index*slice)-(slice/2);

const extraSpin=360*5;

rotation+=extraSpin+stopAngle;

canvas.style.transform=
`rotate(${rotation}deg)`;

setTimeout(()=>{

document.getElementById(
"result"
).innerHTML=
`🎉 ${name.toUpperCase()}
mendapat Rp ${hadiah.toLocaleString()}`;

confetti({
particleCount:180,
spread:100
});

spinning=false;

},5000);
}

</script>

</body>
</html>
