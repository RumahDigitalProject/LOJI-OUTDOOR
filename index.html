<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Dompetku Neon Pro</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #6366f1;
            --accent: #a855f7;
            --success: #22c55e;
            --danger: #ff4757;
            --warning: #f1c40f;
            --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --glass: rgba(255, 255, 255, 0.9);
            --text: #1e293b;
        }

        /* Mode Gelap Otomatis */
        @media (prefers-color-scheme: dark) {
            :root {
                --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
                --glass: rgba(30, 41, 59, 0.8);
                --text: #f1f5f9;
            }
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body { 
            background: var(--bg-gradient); 
            background-attachment: fixed;
            color: var(--text); 
            padding: 20px; 
            min-height: 100vh;
        }

        .container { max-width: 480px; margin: auto; }

        header { 
            margin-bottom: 30px; 
            text-align: center; 
            color: white;
            text-shadow: 0 4px 10px rgba(0,0,0,0.2);
        }
        header h1 { font-size: 32px; font-weight: 800; letter-spacing: -1px; }
        
        /* Status Cloud Animasi */
        .status-cloud { 
            font-size: 10px; font-weight: 800; padding: 6px 15px; 
            border-radius: 50px; background: rgba(255,255,255,0.2); 
            color: white; display: inline-block; backdrop-filter: blur(5px);
            margin-top: 10px; border: 1px solid rgba(255,255,255,0.3);
        }
        .online { background: var(--success); box-shadow: 0 0 15px var(--success); }

        /* Card Style - Glassmorphism */
        .card { 
            background: var(--glass); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border-radius: 30px; 
            padding: 25px; 
            margin-bottom: 20px; 
            box-shadow: 0 15px 35px rgba(0,0,0,0.15);
            border: 1px solid rgba(255,255,255,0.2);
        }

        .label { font-size: 11px; font-weight: 800; opacity: 0.6; text-transform: uppercase; margin-bottom: 15px; display: block; letter-spacing: 1px; }

        /* Dashboard Grid */
        .balance-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        .b-item { 
            padding: 18px; border-radius: 22px; 
            background: rgba(255,255,255,0.5); 
            border: 1px solid rgba(255,255,255,0.5);
            box-shadow: inset 0 2px 5px rgba(255,255,255,0.5);
        }
        .b-item span { font-size: 12px; font-weight: 700; opacity: 0.7; }
        .b-item p { font-size: 18px; font-weight: 800; margin: 5px 0; }
        
        /* Input & Select */
        input, select { 
            width: 100%; background: rgba(255,255,255,0.8); border: 2px solid transparent; 
            color: #1e293b; padding: 16px; border-radius: 20px; margin-bottom: 15px; 
            font-size: 16px; font-weight: 600; outline: none; transition: 0.3s;
        }
        input:focus { border-color: var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.3); }

        /* Buttons with Neon Effect */
        .btn { 
            width: 100%; padding: 18px; border-radius: 20px; border: none; 
            font-weight: 800; cursor: pointer; transition: 0.3s; font-size: 16px; 
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-primary { background: var(--primary); color: white; box-shadow: 0 8px 20px rgba(99, 102, 241, 0.4); }
        .btn-success { background: var(--success); color: white; box-shadow: 0 8px 20px rgba(34, 197, 94, 0.4); }
        .btn-outline { background: transparent; border: 2px solid var(--primary); color: var(--primary); }
        .btn:active { transform: scale(0.95); }

        /* History Items */
        .history-item { 
            display: flex; justify-content: space-between; align-items: center;
            padding: 18px; background: rgba(255,255,255,0.3); 
            border-radius: 20px; margin-bottom: 10px;
        }
        .history-item b { font-size: 16px; display: block; }
        .history-item small { opacity: 0.6; font-size: 11px; font-weight: 700; }
        .amt { font-weight: 800; font-size: 16px; padding: 5px 12px; border-radius: 12px; background: rgba(255,255,255,0.5); }

        .stats-highlight { 
            background: linear-gradient(45deg, var(--primary), var(--accent)); 
            color: white; padding: 25px; border-radius: 25px; margin-top: 15px; text-align: center;
            box-shadow: 0 10px 25px rgba(99, 102, 241, 0.4);
        }
    </style>
</head>
<body>

<div class="container">
    <header>
        <h1>Dompetku 💸</h1>
        <div id="status" class="status-cloud">MENGHUBUNGKAN CLOUD...</div>
    </header>

    <div class="card">
        <span class="label">💰 Saldo Tersedia</span>
        <div class="balance-grid">
            <div class="b-item" style="color: var(--success);"><span>WAJIB</span><p id="v-kebutuhan">0</p></div>
            <div class="b-item" style="color: var(--primary);"><span>TABUNG</span><p id="v-tabungan">0</p></div>
            <div class="b-item" style="color: var(--warning);"><span>MAIN</span><p id="v-keinginan">0</p></div>
            <div class="b-item" style="color: var(--danger);"><span>DARURAT</span><p id="v-darurat">0</p></div>
        </div>
    </div>

    <div class="card">
        <span class="label">🚀 Masukkan Gaji</span>
        <div style="display: flex; gap: 10px;">
            <input type="number" id="inGaji" placeholder="Nominal Rp">
            <select id="blnGaji" style="width: 150px;"></select>
        </div>
        <button class="btn btn-primary" onclick="tambahGaji()">Alokasikan Sekarang</button>
    </div>

    <div class="card">
        <span class="label">💳 Catat Jajan</span>
        <select id="katKeluar">
            <option value="kebutuhan">Kebutuhan (50%)</option>
            <option value="tabungan">Tabungan (20%)</option>
            <option value="keinginan">Keinginan (20%)</option>
            <option value="darurat">Darurat (10%)</option>
        </select>
        <input type="text" id="ketKeluar" list="hintList" placeholder="Beli apa nih?">
        <datalist id="hintList"></datalist>
        <input type="number" id="nomKeluar" placeholder="Nominal Rp">
        <button class="btn btn-success" onclick="catat()">Simpan Transaksi</button>
    </div>

    <div class="card">
        <span class="label">📊 History Laporan</span>
        <div style="display: flex; gap: 10px; margin-bottom: 15px;">
            <select id="fBulan" onchange="update()"></select>
            <input type="text" id="fKeyword" onkeyup="update()" placeholder="Cari..." style="margin-bottom:0;">
        </div>
        
        <div id="statsBox" class="stats-highlight" style="display:none;">
            <small>Total Terfilter</small>
            <h2 id="totalFiltered" style="font-size: 30px;">Rp 0</h2>
        </div>

        <button class="btn btn-outline" style="margin-top:20px;" onclick="unduhLaporan()">📥 DOWNLOAD CSV</button>
        <div id="logList" style="margin-top:20px;"></div>
    </div>

    <button onclick="hapusSemua()" style="background:none; border:none; color:white; font-size: 11px; width: 100%; font-weight: 800; margin: 30px 0; opacity: 0.6; text-decoration: underline;">RESET SEMUA DATA</button>
</div>

<script>
    const URL_CLOUD = "https://script.google.com/macros/s/AKfycbxVDw1tDrqVeVsuwMGTUtuuSSfU9uBdHCXK4cfgwGLoTcMbio0LuXo0sWLiS83GveSc/exec";

    let db = JSON.parse(localStorage.getItem('dompet_neon_v1')) || {
        saldo: { kebutuhan: 0, tabungan: 0, keinginan: 0, darurat: 0 },
        initial: { kebutuhan: 0, tabungan: 0, keinginan: 0, darurat: 0 },
        logs: [], hints: []
    };

    const fmt = (n) => "Rp " + Math.round(n).toLocaleString('id-ID');

    async function kirimCloud(payload) {
        const s = document.getElementById('status');
        s.innerText = "☁️ SINKRONISASI...";
        s.classList.remove('online');
        try {
            await fetch(URL_CLOUD, { method: 'POST', mode: 'no-cors', body: JSON.stringify(payload) });
            s.innerText = "✅ CLOUD AKTIF";
            s.classList.add('online');
        } catch (e) { s.innerText = "❌ ERROR CLOUD"; }
    }

    function update() {
        document.getElementById('v-kebutuhan').innerText = fmt(db.saldo.kebutuhan);
        document.getElementById('v-tabungan').innerText = fmt(db.saldo.tabungan);
        document.getElementById('v-keinginan').innerText = fmt(db.saldo.keinginan);
        document.getElementById('v-darurat').innerText = fmt(db.saldo.darurat);

        const fMonth = document.getElementById('fBulan').value;
        const fKey = document.getElementById('fKeyword').value.toLowerCase();
        const logList = document.getElementById('logList');
        let totalF = 0;

        logList.innerHTML = "";
        db.logs.forEach(l => {
            if((fMonth === 'all' || l.month === fMonth) && l.ket.toLowerCase().includes(fKey)) {
                if(l.type === 'OUT') totalF += l.amt;
                logList.innerHTML += `
                    <div class="history-item">
                        <div><b>${l.ket}</b><small>${l.date} | ${l.kat}</small></div>
                        <div class="amt" style="color:${l.type==='IN'?'var(--success)':'var(--danger)'}">
                            ${l.type==='IN'?'+':'-'}${fmt(l.amt)}
                        </div>
                    </div>`;
            }
        });

        document.getElementById('statsBox').style.display = (fKey || fMonth !== 'all') ? "block" : "none";
        document.getElementById('totalFiltered').innerText = fmt(totalF);

        const hintList = document.getElementById('hintList');
        hintList.innerHTML = "";
        [...new Set(db.hints)].forEach(h => { hintList.innerHTML += `<option value="${h}">`; });

        localStorage.setItem('dompet_neon_v1', JSON.stringify(db));
    }

    function tambahGaji() {
        const amt = parseFloat(document.getElementById('inGaji').value);
        const bln = document.getElementById('blnGaji').value;
        if(!amt) return;
        
        const now = new Date();
        const dateStr = now.toLocaleDateString('id-ID') + " " + now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});
        
        db.saldo.kebutuhan += amt * 0.5; db.saldo.tabungan += amt * 0.2;
        db.saldo.keinginan += amt * 0.2; db.saldo.darurat += amt * 0.1;
        
        const payload = { date: dateStr, kat: 'PEMASUKAN', ket: 'Gaji Masuk', type: 'IN', amt: amt, month: bln };
        db.logs.unshift(payload);
        kirimCloud(payload);
        document.getElementById('inGaji').value = "";
        update();
    }

    function catat() {
        const kat = document.getElementById('katKeluar').value;
        const ket = document.getElementById('ketKeluar').value;
        const nom = parseFloat(document.getElementById('nomKeluar').value);
        const bln = document.getElementById('blnGaji').value; 

        if(!ket || !nom) return;
        if(nom > db.saldo[kat]) return alert("Saldo tidak cukup!");

        const now = new Date();
        const dateStr = now.toLocaleDateString('id-ID') + " " + now.toLocaleTimeString('id-ID', {hour:'2-digit', minute:'2-digit'});

        db.saldo[kat] -= nom;
        const payload = { date: dateStr, kat: kat, ket: ket, type: 'OUT', amt: nom, month: bln };
        db.logs.unshift(payload);
        if(!db.hints.includes(ket)) db.hints.push(ket);
        kirimCloud(payload);
        document.getElementById('ketKeluar').value = "";
        document.getElementById('nomKeluar').value = "";
        update();
    }

    function unduhLaporan() {
        let csv = "Tanggal,Kategori,Keterangan,Tipe,Nominal\n";
        db.logs.forEach(l => { csv += `${l.date},${l.kat},${l.ket},${l.type},${l.amt}\n`; });
        const blob = new Blob([csv], { type: 'text/csv' });
        const link = document.createElement("a");
        link.href = URL.createObjectURL(blob);
        link.download = `Laporan_Neon.csv`;
        link.click();
    }

    async function hapusSemua() {
        if(confirm("RESET SEMUA DATA? (HP & CLOUD)")) {
            try {
                await fetch(URL_CLOUD, { method: 'POST', mode: 'no-cors', body: JSON.stringify({ action: "RESET" }) });
                localStorage.clear(); location.reload();
            } catch (e) { alert("Gagal Reset Cloud!"); }
        }
    }

    // Init Dropdowns
    const months = ["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"];
    const blnGaji = document.getElementById('blnGaji');
    const fBulan = document.getElementById('fBulan');
    fBulan.innerHTML = `<option value="all">SEMUA BULAN</option>`;
    months.forEach((m, i) => {
        const opt = `<option value="${i+1}">${m.toUpperCase()}</option>`;
        blnGaji.innerHTML += opt;
        fBulan.innerHTML += opt;
    });

    document.getElementById('blnGaji').value = new Date().getMonth() + 1;
    update();
</script>
</body>
</html>
