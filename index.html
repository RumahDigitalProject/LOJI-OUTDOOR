<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Spin THR</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js">/* ================= LIVE HISTORY ENGINE ================= */

let historyLoop=[];
let historyIndex=0;

let savedHistory=
JSON.parse(localStorage.getItem("thrHistory"))||[];

historyLoop=[...savedHistory];

function addHistory(name,amount){

const data={name,amount};

historyLoop.push(data);
savedHistory.push(data);

localStorage.setItem(
"thrHistory",
JSON.stringify(savedHistory)
);
}

/* LOOP TAK BERHENTI */
function startHistoryLoop(){

if(historyLoop.length===0){
setTimeout(startHistoryLoop,2000);
return;
}

const item=historyLoop[historyIndex];

spawnHistory(item.name,item.amount);

historyIndex++;
if(historyIndex>=historyLoop.length)
historyIndex=0;

setTimeout(startHistoryLoop,2000);
}

function spawnHistory(name,amount){

const box=document.getElementById("historyBox");
if(!box) return;

const div=document.createElement("div");
div.className="history-item";

div.innerText=
amount==0
?`😢 ${name.toUpperCase()} ZONK`
:`🎉 ${name.toUpperCase()} mendapatkan Rp ${Number(amount).toLocaleString()}`;

box.appendChild(div);

setTimeout(()=>div.remove(),5000);
}

/* START AUTO */
startHistoryLoop();

/* RESET ADMIN */
function resetHistory(){

historyLoop=[];
savedHistory=[];

localStorage.removeItem("thrHistory");

const hb=document.getElementById("historyBox");
if(hb) hb.innerHTML="";

alert("History direset ✅");
}
</script>
<style>

body{
margin:0;
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
overflow:hidden;
}

.app{
max-width:420px;
width:100%;
text-align:center;
}

input{
padding:8px;
width:60%;
font-size:14px;
border:none;
border-radius:8px;
text-align:center;
margin-bottom:50px;
}

.pointer{
width:0;
height:0;
border-left:19px solid transparent;
border-right:19px solid transparent;
border-top:45px solid gold;
margin:auto;
}

canvas{
border-radius:50%;
border:10px solid white;
}

button{
margin-top:20px;
padding:14px 40px;
font-size:22px;
background:gold;
border:none;
border-radius:12px;
cursor:pointer;
}

/* POPUP */

.popup{
position:fixed;
inset:0;
background:rgba(0,0,0,.85);
display:flex;
justify-content:center;
align-items:center;
opacity:0;
visibility:hidden;
transition:.4s;
}

.popup.show{
opacity:1;
visibility:visible;
}

.card{
background:linear-gradient(135deg,#fde047,#f59e0b);
color:black;
padding:35px;
border-radius:20px;
animation:pop .4s ease;
border:none;
text-align:center;
font-family:Arial, sans-serif;
}
#winner,
#message,
#amount{
margin:10px 0;
font-weight:bold;
}

#winner{
font-size:22px;
}

#message{
font-size:20px;
}

#amount{
font-size:36px; /* lebih besar */
  }

@keyframes pop{
from{transform:scale(.5)}
to{transform:scale(1)}
}

/* ===== ADMIN MODERN ===== */

#adminPanel{
overflow-y:auto;
}

#adminPanel .card{
width:90%;
max-width:700px;
background:#0f172a;
color:white;
max-height:90vh;
overflow-y:auto;
}

.admin-row{
display:grid;
grid-template-columns:1.2fr 1fr 1fr 40px;
gap:10px;
margin-bottom:10px;
align-items:center;
}

.admin-row input,
.admin-row select{
padding:10px;
border-radius:8px;
border:none;
background:#1e293b;
color:white;
}

.deleteBtn{
background:#ef4444;
border:none;
color:white;
border-radius:8px;
cursor:pointer;
height:38px;
}

.admin-actions{
display:flex;
gap:10px;
justify-content:center;
margin-top:15px;
}

.admin-actions button{
font-size:16px;
padding:10px 20px;
}

.history-box{
height:90px;
overflow:hidden;
position:relative;
margin-bottom:15px;
}

.history-item{
position:absolute;
left:0;
right:0;
bottom:-40px;
background:#0f172a;
padding:6px 10px;
border-radius:8px;
font-size:14px;
white-space:nowrap;
animation:rise 5s linear forwards;
}

@keyframes rise{
0%{transform:translateY(0);opacity:0}
15%{opacity:1}
85%{opacity:1}
100%{transform:translateY(-110px);opacity:0}
}
</style>
</head>

<body>

<div class="app">

<h2>THR 2026</h2>

<input id="playerName" placeholder="Masukkan Nama">

<div class="pointer"></div>

<canvas id="wheel" width="320" height="320"></canvas>

<button onclick="spin()">SPIN</button>

</div>

<!-- RESULT -->
<div id="popup" class="popup">
<div class="card">
<h2 id="winner"></h2>
<p id="message"></p>
<h1 id="amount"></h1>
<button id="actionBtn">CLAIM</button>
</div>
</div>

<!-- ADMIN -->
<div id="adminPanel" class="popup">
<div class="card">

<h2>⚙️ ADMIN PANEL</h2>

<div id="adminList"></div>

<div class="admin-actions">
<button onclick="addRow()">+ Tambah</button>
<button onclick="saveAdmin()">💾 Simpan</button>
</div>

</div>
</div>

<script>

/* ========= DATA ========= */

let playerRewards=
JSON.parse(localStorage.getItem("thrData"))||{};

function autoSave(){

playerRewards={};

document
.querySelectorAll("#adminList .admin-row")
.forEach(row=>{

let name=row.querySelector(".name").value.trim().toLowerCase();
let mode=row.querySelector(".mode").value;
let hadiah=parseInt(row.querySelector(".hadiah").value);

if(name){
playerRewards[name]={mode,hadiah};
}

});

localStorage.setItem("thrData",
JSON.stringify(playerRewards));
}

/* ===== ADMIN ===== */

function openAdmin(){
document.getElementById("adminPanel").classList.add("show");
renderAdmin();
}

function renderAdmin(){

let wrap=document.getElementById("adminList");
wrap.innerHTML="";

Object.keys(playerRewards).forEach(name=>{

wrap.innerHTML+=rowHTML(
name,
playerRewards[name].mode,
playerRewards[name].hadiah
);

});
}

function rowHTML(name="",mode="direct",hadiah=""){

return `
<div class="admin-row">

<input class="name"
value="${name}"
oninput="autoSave()"
placeholder="Nama">

<select class="mode"
onchange="autoSave()">
<option value="direct"
${mode=="direct"?"selected":""}>Langsung</option>

<option value="zonkFirst"
${mode=="zonkFirst"?"selected":""}>Zonk dulu</option>
</select>

<input type="number"
class="hadiah"
value="${hadiah}"
oninput="autoSave()"
placeholder="Nominal">

<button class="deleteBtn"
onclick="this.parentElement.remove();autoSave()">✕</button>

</div>`;
}

/* ✅ TAMBAH AUTO SIMPAN */
function addRow(){

autoSave();

document.getElementById("adminList")
.insertAdjacentHTML(
"beforeend",
rowHTML()
);

}

/* FINAL SAVE */
function saveAdmin(){
autoSave();
document.getElementById("adminPanel")
.classList.remove("show");
alert("Data tersimpan ✅");
}

/* ===== SPIN SYSTEM (ASLI) ===== */

const rewards=[
10000,20000,50000,0,100000,200000,500000,0
];

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

let spinning=false;
let visualRotation=0;
let playerTurn={};

/* ===== SOUND SPIN ===== */

let audioCtx;
let spinInterval;

function startSpinSound(duration){

audioCtx = new (window.AudioContext || window.webkitAudioContext)();

let startTime = Date.now();

spinInterval = setInterval(()=>{

let elapsed = Date.now() - startTime;
let progress = elapsed / duration;

// suara makin lambat
let intervalSpeed = 30 + (progress * 200);

let osc = audioCtx.createOscillator();
let gain = audioCtx.createGain();

osc.type = "square";
osc.frequency.value = 1000 - (progress * 700);

gain.gain.value = 0.05;

osc.connect(gain);
gain.connect(audioCtx.destination);

osc.start();
osc.stop(audioCtx.currentTime + 0.03);

clearInterval(spinInterval);
spinInterval = setInterval(()=>{}, intervalSpeed);

},30);

setTimeout(()=>{
clearInterval(spinInterval);
},duration);

}

const center=160;
const radius=160;

function draw(){

const arc=(Math.PI*2)/rewards.length;

const colors=[
"#ef4444","#22c55e","#3b82f6",
"#f59e0b","#a855f7","#111827",
"#14b8a6","#111827"
];

for(let i=0;i<rewards.length;i++){

ctx.beginPath();
ctx.fillStyle=colors[i];
ctx.moveTo(center,center);
ctx.arc(center,center,radius,i*arc,(i+1)*arc);
ctx.fill();

ctx.save();
ctx.translate(center,center);
ctx.rotate(i*arc+arc/2);

ctx.fillStyle="white";
ctx.font="bold 16px Arial";

ctx.fillText(
rewards[i]==0?"ZONK":
"Rp"+rewards[i].toLocaleString(),
70,5);

ctx.restore();
}
}
draw();

function spin(){

if(spinning)return;

let name=document
.getElementById("playerName")
.value.trim().toLowerCase();

if(!name)return alert("Masukkan nama");

if(name==="admin"){
openAdmin();
return;
}

if(!playerTurn[name])
playerTurn[name]=1;

spinning=true;
startSpinSound(6000);

let hadiah;

if(playerRewards[name]){

let data=playerRewards[name];

if(data.mode==="zonkFirst"
&& playerTurn[name]===1){
hadiah=0;
}else{
hadiah=data.hadiah;
}

}else{
hadiah=rewards[Math.floor(Math.random()*rewards.length)];
}

let index=rewards.indexOf(hadiah);

const slice=360/rewards.length;
const targetAngle=270-(index*slice)-(slice/2);

canvas.style.transition="none";
canvas.style.transform=`rotate(${visualRotation%360}deg)`;

canvas.offsetHeight;

visualRotation+=(8*360)+((targetAngle-(visualRotation%360)+360)%360);

canvas.style.transition=
"transform 6s cubic-bezier(.12,.95,.18,1)";

canvas.style.transform=`rotate(${visualRotation}deg)`;

setTimeout(()=>{

playerTurn[name]++;
showPopup(name,hadiah);

if(hadiah!==0)
confetti({particleCount:300});

spinning=false;

},6000);
}

/* POPUP */

function showPopup(name,amount){

let winner=document.getElementById("winner");
let message=document.getElementById("message");
let amountText=document.getElementById("amount");
let btn=document.getElementById("actionBtn");

winner.innerText=name.toUpperCase();

if(amount==0){

message.innerText="Maaf anda mendapat";
amountText.innerText="ZONK";

btn.innerText="COBA LAGI";

btn.onclick=function(){
document.getElementById("popup").classList.remove("show");
setTimeout(()=>{ spin(); },300);
};

}else{

message.innerText="Selamat anda mendapatkan";
amountText.innerText="Rp "+amount.toLocaleString();

btn.innerText="CLAIM";

btn.onclick=function(){
document.getElementById("popup").classList.remove("show");
document.getElementById("playerName").value="";
};

}

document.getElementById("popup").classList.add("show");
}

/* LOOP TAK BERHENTI */
function startHistoryLoop(){

if(historyLoop.length===0){
setTimeout(startHistoryLoop,2000);
return;
}

const item=historyLoop[historyIndex];

spawnHistory(item.name,item.amount);

historyIndex++;
if(historyIndex>=historyLoop.length)
historyIndex=0;

setTimeout(startHistoryLoop,2000);
}

function spawnHistory(name,amount){

const box=document.getElementById("historyBox");
if(!box) return;

const div=document.createElement("div");
div.className="history-item";

div.innerText=
amount==0
?`😢 ${name.toUpperCase()} ZONK`
:`🎉 ${name.toUpperCase()} mendapatkan Rp ${Number(amount).toLocaleString()}`;

box.appendChild(div);

setTimeout(()=>div.remove(),5000);
}

/* START AUTO */
startHistoryLoop();

/* RESET ADMIN */
function resetHistory(){

historyLoop=[];
savedHistory=[];

localStorage.removeItem("thrHistory");

const hb=document.getElementById("historyBox");
if(hb) hb.innerHTML="";

alert("History direset ✅");
}
</script>
</body>
</html>
