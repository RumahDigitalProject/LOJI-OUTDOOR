<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Spin THR</title>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

<style>

body{
margin:0;
background:#020617;
font-family:Arial;
display:flex;
justify-content:center;
align-items:center;
height:100vh;
color:white;
overflow:hidden;
}

.app{
width:100%;
max-width:420px;
text-align:center;
}

/* INPUT */
input{
padding:12px;
width:80%;
border:none;
border-radius:8px;
font-size:18px;
text-align:center;
margin-bottom:15px;
}

/* POINTER ↓ */
.pointer{
width:0;
height:0;
border-left:22px solid transparent;
border-right:22px solid transparent;
border-top:45px solid gold;
margin:auto;
z-index:10;
}

/* WHEEL */
canvas{
border-radius:50%;
border:10px solid white;
transition:transform 5s cubic-bezier(.15,.85,.25,1);
}

button{
margin-top:20px;
padding:15px 40px;
font-size:22px;
background:gold;
border:none;
border-radius:12px;
font-weight:bold;
cursor:pointer;
}

/* POPUP */
.popup{
position:fixed;
top:0;
left:0;
width:100%;
height:100%;
background:rgba(0,0,0,.85);
display:flex;
justify-content:center;
align-items:center;
visibility:hidden;
opacity:0;
transition:.4s;
}

.popup.show{
visibility:visible;
opacity:1;
}

.card{
background:linear-gradient(135deg,#facc15,#f59e0b);
color:black;
padding:35px;
border-radius:20px;
text-align:center;
animation:pop .5s ease;
}

@keyframes pop{
from{transform:scale(.5)}
to{transform:scale(1)}
}

.card h1{
margin:10px 0;
font-size:32px;
}

.close{
margin-top:15px;
padding:10px 25px;
border:none;
background:black;
color:white;
border-radius:8px;
cursor:pointer;
}

</style>
</head>

<body>

<div class="app">

<h2>🎁 SPIN THR 🎁</h2>

<input id="playerName"
placeholder="Masukkan Nama">

<div class="pointer"></div>

<canvas id="wheel"
width="320"
height="320"></canvas>

<button onclick="spin()">SPIN</button>

</div>

<!-- POPUP -->
<div id="popup" class="popup">
<div class="card">
<h2>SELAMAT 🎉</h2>
<h1 id="winner"></h1>
<h1 id="amount"></h1>
<button class="close"
onclick="closePopup()">Tutup</button>
</div>
</div>

<audio id="sound"
src="https://assets.mixkit.co/active_storage/sfx/2003/2003-preview.mp3"></audio>

<script>

/* ================= ADMIN ================= */

const playerRewards={
"andi":100000,
"budi":25000,
"siti":50000,
"rina":75000
};

const rewards=[
10000,
25000,
50000,
75000,
100000
];

/* ========================================== */

const canvas=document.getElementById("wheel");
const ctx=canvas.getContext("2d");

const center=160;
const radius=160;

let rotation=0;
let spinning=false;

/* DRAW WHEEL */
function draw(){

const arc=(Math.PI*2)/rewards.length;

const colors=[
"#ef4444",
"#22c55e",
"#3b82f6",
"#f59e0b",
"#a855f7"
];

for(let i=0;i<rewards.length;i++){

ctx.beginPath();
ctx.fillStyle=colors[i];

ctx.moveTo(center,center);

ctx.arc(center,center,
radius,
i*arc,
(i+1)*arc);

ctx.fill();

ctx.save();
ctx.translate(center,center);
ctx.rotate(i*arc+arc/2);

ctx.fillStyle="white";
ctx.font="bold 16px Arial";

ctx.fillText(
"Rp"+rewards[i].toLocaleString(),
70,5
);

ctx.restore();
}
}

draw();

/* SPIN AKURAT */
function spin(){

if(spinning)return;

let name=
document.getElementById("playerName")
.value.toLowerCase().trim();

if(!playerRewards[name]){
alert("Nama tidak terdaftar!");
return;
}

spinning=true;
document.getElementById("sound").play();

let hadiah=playerRewards[name];

let index=rewards.indexOf(hadiah);

/* pointer di atas = 270deg */
const slice=360/rewards.length;
const targetAngle=
270-(index*slice)-(slice/2);

const extraSpin=360*5;

rotation+=extraSpin+targetAngle;

canvas.style.transform=
`rotate(${rotation}deg)`;

setTimeout(()=>{

showPopup(name,hadiah);

confetti({
particleCount:250,
spread:120
});

spinning=false;

},5000);
}

/* POPUP */
function showPopup(name,amount){

document.getElementById("winner")
.innerText=name.toUpperCase();

document.getElementById("amount")
.innerText=
"Rp "+amount.toLocaleString();

document.getElementById("popup")
.classList.add("show");
}

function closePopup(){
document.getElementById("popup")
.classList.remove("show");
}

</script>

</body>
</html>
